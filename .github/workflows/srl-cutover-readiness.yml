name: Omega SRL cutover readiness

on:
  workflow_dispatch:
    inputs:
      require_ready:
        description: "Fail unless the complete published corpus is mechanically ready for explicit cutover review"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  audit:
    uses: dalagab/omega/.github/workflows/srl-cutover-readiness.yml@sigmascope
    with:
      require_ready: ${{ inputs.require_ready || false }}