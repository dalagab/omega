name: Omega catalog snapshot and client database

on:
  workflow_call:
    inputs:
      concurrency:
        type: string
        required: false
        default: "8"
      timeout:
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        type: string
        required: false
        default: "168"
      allow_source_removal:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel repository fetchers"
        type: string
        required: false
        default: "8"
      timeout:
        description: "Per-request timeout in seconds"
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        description: "Reuse successful website enrichment for this many hours"
        type: string
        required: false
        default: "168"
      allow_source_removal:
        description: "Allow an intentional removal from the previously canonical source registry"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: omega-catalog-sigmascope-exclusive
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate catalog contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Python security dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - name: Install YARA compile-check dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yara
      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Run catalog self-tests
        run: |
          python tools/catalog/test_sqlite_catalog.py
          python tools/catalog/project_marketplace_catalog.py --self-test

  collect:
    name: Discover source feeds
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Discover curated, Puni.sh and GitHub PluginMaster sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/collect_sources.py
          --curated sources/curated-sources.json
          --community sources/community-sources.json
          --output catalog/raw-sources.json
      - uses: actions/upload-artifact@v7
        with:
          name: raw-sources
          path: catalog/raw-sources.json
          retention-days: 7

  enrich:
    name: Fetch and normalize manifests
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: raw-sources
          path: catalog/
      - name: Download previous published marketplace DB for conditional request hints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --repo "${{ github.repository }}" --pattern omega-marketplace.sqlite.zip --dir catalog/seed || true
          if [ -f catalog/seed/omega-marketplace.sqlite.zip ]; then
            python -m zipfile -e catalog/seed/omega-marketplace.sqlite.zip catalog/seed
          fi
      - name: Fetch PluginMaster feeds
        run: >-
          python tools/catalog/enrich_metadata.py
          --input catalog/raw-sources.json
          --output catalog/enriched-sources.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --concurrency ${{ inputs.concurrency || '8' }}
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v7
        with:
          name: enriched-sources
          path: catalog/enriched-sources.json
          retention-days: 7

  scrape:
    name: Incrementally enrich public project pages
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: enriched-sources
          path: catalog/
      - name: Download previous published marketplace DB for website cache hints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --repo "${{ github.repository }}" --pattern omega-marketplace.sqlite.zip --dir catalog/seed || true
          if [ -f catalog/seed/omega-marketplace.sqlite.zip ]; then
            python -m zipfile -e catalog/seed/omega-marketplace.sqlite.zip catalog/seed
          fi
      - name: Reuse fresh enrichment and scrape only new/stale project pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/scrape_websites_incremental.py
          --input catalog/enriched-sources.json
          --output catalog/website-enrichment.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --max-age-hours ${{ inputs.website_max_age_hours || '168' }}
          --concurrency 4
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v7
        with:
          name: website-enrichment
          path: catalog/website-enrichment.json
          retention-days: 7

  publish:
    name: Freeze JSON state and compile the Omega client DB
    needs: [collect, enrich, scrape]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      discord_notice_ready: ${{ steps.discord_notice.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
          fetch-depth: 0
      - name: Record security-services source commit
        id: security_source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Python security dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - name: Verify Definitions freezer Python dependencies
        run: python -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: Install YARA compile-check dependency for Definitions freezer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yara
      - uses: actions/download-artifact@v8
        with:
          name: raw-sources
          path: catalog/
      - uses: actions/download-artifact@v8
        with:
          name: enriched-sources
          path: catalog/
      - uses: actions/download-artifact@v8
        with:
          name: website-enrichment
          path: catalog/
      - name: Checkout current Security Evidence v2
        uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout previous canonical catalog state when available
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: catalog-data
          path: catalog/previous-state
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize compatible previous canonical JSON as normalization seed
        id: previous_catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "compatible=false" >> "$GITHUB_OUTPUT"
          if [ -f catalog/previous-state/catalog/index.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            if python tools/catalog/catalog_json_store.py identity-compatible \
              --root catalog/previous-state/catalog > catalog/previous-seed-identity.json; then
              echo "compatible=true" >> "$GITHUB_OUTPUT"
              python tools/catalog/catalog_json_store.py materialize \
                --root catalog/previous-state/catalog \
                --database catalog/seed/omega-catalog.sqlite
            else
              cat catalog/previous-seed-identity.json
              echo "::notice::Previous canonical catalog uses a legacy/incompatible identity epoch; rebuilding normalization state without a catalog seed."
            fi
          fi
      - name: Normalize discovery into a temporary relational working catalog
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --out catalog/normalized
            --curated sources/curated-sources.json
            --community sources/community-sources.json
            --raw-sources catalog/raw-sources.json
            --enriched-sources catalog/enriched-sources.json
            --website-enrichment catalog/website-enrichment.json
            --download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
            --descriptor-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/catalog.json"
          )
          if [ -f catalog/seed/omega-catalog.sqlite ]; then args+=(--seed catalog/seed/omega-catalog.sqlite); fi
          python tools/catalog/build_sqlite_catalog.py "${args[@]}"
      - name: Export canonical public JSON catalog
        run: >-
          python tools/catalog/catalog_json_store.py export
          --database catalog/normalized/omega-catalog.sqlite
          --output catalog/state-catalog
          --built-from-dev-commit "${{ steps.security_source.outputs.sha }}"
      - name: Validate canonical source inventory and retention
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --raw catalog/raw-sources.json
            --enriched catalog/enriched-sources.json
            --catalog-root catalog/state-catalog
            --curated sources/curated-sources.json
            --community sources/community-sources.json
            --aliases sources/source-url-aliases.json
            --report catalog/source-inventory.json
          )
          if [ "${{ steps.previous_catalog.outputs.compatible }}" = "true" ]; then
            args+=(--previous-catalog-root catalog/previous-state/catalog)
          elif [ "${{ steps.previous_catalog.outputs.present }}" = "true" ]; then
            echo "::notice::Skipping only historical source-retention comparison for the incompatible pre-migration catalog identity epoch; current discovery/configuration/canonical coverage remains fail-closed."
          fi
          if [ "${{ inputs.allow_source_removal || false }}" = "true" ]; then args+=(--allow-source-removal); fi
          python tools/catalog/source_inventory_guard.py "${args[@]}"
      - name: Observe public source HEAD revisions without fetching source bodies
        run: >-
          python tools/catalog/source_revision_observer.py
          --catalog-root catalog/state-catalog
          --output catalog/source-revision-observations.json
          --timeout 12
          --concurrency 16
      - name: Freeze optional ClamAV feed into a content-addressed release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          final_manifest="catalog/secondary-security-asset-manifest.json"
          pending_manifest="catalog/secondary-security-asset-manifest.pending.json"
          rm -f "$final_manifest" "$pending_manifest"
          mkdir -p catalog/clamav-database catalog/secondary-security-assets

          retain_previous_clamav() {
            rm -f "$pending_manifest" "$final_manifest"
            if python tools/catalog/secondary_security_assets.py retain-previous-clamav \
              --definitions-root catalog/previous-state/definitions \
              --manifest-output "$final_manifest"; then
              echo "::notice::Retained the previously published frozen ClamAV asset for this Definitions revision."
            else
              rm -f "$final_manifest"
              echo "::warning::No valid previously frozen ClamAV asset is available; continuing this Definitions revision without ClamAV."
            fi
          }

          clamav_tools_ready=true
          if ! sudo apt-get install -y --no-install-recommends clamav clamav-freshclam; then
            echo "::warning::Unable to install optional ClamAV tooling."
            clamav_tools_ready=false
          fi

          if [ "$clamav_tools_ready" = "true" ]; then
            sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
            set +e
            sudo freshclam --stdout
            freshclam_status=$?
            set -e
            if ! while IFS= read -r -d '' file; do
              sudo cp "$file" catalog/clamav-database/ || exit 1
            done < <(sudo find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print0 2>/dev/null); then
              echo "::warning::Unable to stage optional ClamAV database files."
              clamav_tools_ready=false
            elif ! sudo chown -R "$(id -u):$(id -g)" catalog/clamav-database; then
              echo "::warning::Unable to normalize optional ClamAV database ownership."
              clamav_tools_ready=false
            fi
          else
            freshclam_status=125
          fi

          published_new_clamav=false
          if [ "$clamav_tools_ready" = "true" ] && \
             find catalog/clamav-database -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit | grep -q .; then
            if python tools/catalog/secondary_security_assets.py build-clamav \
              --database-dir catalog/clamav-database \
              --output-dir catalog/secondary-security-assets \
              --asset-base-url "https://github.com/${{ github.repository }}/releases/download/sigmascope-definitions" \
              --manifest-output "$pending_manifest"; then
              release_ready=true
              if ! gh release view sigmascope-definitions --repo "${{ github.repository }}" >/dev/null 2>&1; then
                if ! gh release create sigmascope-definitions --repo "${{ github.repository }}" \
                  --title "Omega frozen secondary-security definitions" \
                  --notes "Content-addressed large security-definition assets referenced by frozen SigmaScope Definitions. Workers verify SHA-256 and never update these assets in place."; then
                  echo "::warning::Unable to create the optional ClamAV release; retaining the previous frozen asset instead."
                  release_ready=false
                fi
              fi
              if [ "$release_ready" = "true" ]; then
                if gh release upload sigmascope-definitions catalog/secondary-security-assets/*.zip \
                  --repo "${{ github.repository }}" --clobber; then
                  mv "$pending_manifest" "$final_manifest"
                  published_new_clamav=true
                  echo "::notice::Published a new content-addressed frozen ClamAV asset."
                else
                  echo "::warning::Unable to upload the optional frozen ClamAV asset; retaining the previous frozen asset instead."
                fi
              fi
            else
              echo "::warning::Unable to build the optional frozen ClamAV asset; retaining the previous frozen asset instead."
            fi
          else
            echo "::warning::FreshClam produced no CVD/CLD files (status=$freshclam_status); retaining the previous frozen ClamAV asset when available."
          fi

          if [ "$published_new_clamav" != "true" ]; then
            retain_previous_clamav
          fi
          rm -f "$pending_manifest"
      - name: Freeze daily Definitions and OSV data
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --evidence-root catalog/security-v2-current
            --output catalog/state-definitions
            --built-from-dev-commit "${{ steps.security_source.outputs.sha }}"
            --source-observations catalog/source-revision-observations.json
            --timeout "${{ inputs.timeout || '20' }}"
          )
          if [ -f catalog/secondary-security-asset-manifest.json ]; then
            args+=(--secondary-security-asset-manifest catalog/secondary-security-asset-manifest.json)
          fi
          python tools/catalog/definitions_snapshot.py build "${args[@]}"
      - name: Build deterministic daily Sigmascope queue seed
        run: >-
          python tools/catalog/scan_queue.py build-seed
          --catalog-root catalog/state-catalog
          --definitions-root catalog/state-definitions
          --evidence-root catalog/security-v2-current
          --output catalog/state-scan-queue.json
      - name: Assemble and validate named catalog/Definitions snapshot
        run: |
          python tools/catalog/catalog_state.py assemble \
            --catalog catalog/state-catalog \
            --definitions catalog/state-definitions \
            --queue-seed catalog/state-scan-queue.json \
            --source-inventory catalog/source-inventory.json \
            --output catalog/state
          python tools/catalog/catalog_state.py validate --root catalog/state
      - name: Compile daily Omega marketplace database from JSON + Evidence v2
        run: >-
          python tools/catalog/compile_marketplace_snapshot.py
          --catalog-root catalog/state/catalog
          --definitions-root catalog/state/definitions
          --evidence-root catalog/security-v2-current
          --output catalog/client-dist
          --download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
          --evidence-index-url "https://raw.githubusercontent.com/${{ github.repository }}/security-evidence-v2/index.json"
      - name: Validate exact client publication
        run: python tools/catalog/validate_marketplace_catalog.py --root catalog/client-dist --require-v2
      - name: Publish canonical JSON state atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          python tools/catalog/publish_catalog_state.py --input catalog/state --repo . --branch catalog-data --push
      - name: Publish the once-daily client database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view catalog-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create catalog-latest --repo "${{ github.repository }}" --title "Omega marketplace database" \
              --notes "Daily compiled Omega client database. Canonical catalog JSON is on catalog-data; detailed security evidence is on security-evidence-v2."
          fi
          gh release upload catalog-latest \
            catalog/client-dist/omega-marketplace.sqlite.zip \
            catalog/client-dist/omega-marketplace.sqlite.zip.sha256 \
            catalog/client-dist/catalog.json \
            catalog/client-dist/database-build.json \
            --repo "${{ github.repository }}" --clobber
      - name: Build a sanitised Discord catalog notice
        id: discord_notice
        continue-on-error: true
        run: >-
          python tools/notifications/discord_notice.py catalog
          --catalog-index catalog/state/catalog/index.json
          --previous-catalog-index catalog/previous-state/catalog/index.json
          --definitions-index catalog/state/definitions/index.json
          --previous-definitions-index catalog/previous-state/definitions/index.json
          --repository "${{ github.repository }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output catalog/discord-notice.json
      - name: Upload Discord catalog notice
        if: steps.discord_notice.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: omega-catalog-discord-notice
          path: catalog/discord-notice.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omega-daily-catalog-state
          path: |
            catalog/state/index.json
            catalog/state/catalog/index.json
            catalog/state/definitions/index.json
            catalog/state/definitions/worker/manifest.json
            catalog/state/definitions/source-revisions.json
            catalog/state/scan-queue.json
            catalog/state/source-inventory.json
            catalog/client-dist/catalog.json
            catalog/client-dist/database-build.json
          retention-days: 30

  notify-discord:
    name: Post published catalog update to Discord
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.discord_notice_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: discord-public
    permissions: {}
    steps:
      - name: Checkout notification sender
        uses: actions/checkout@v6
        with:
          ref: sigmascope
          fetch-depth: 1
          persist-credentials: false
      - name: Download sanitised notice
        uses: actions/download-artifact@v8
        with:
          name: omega-catalog-discord-notice
          path: discord-notice
      - name: Post public update
        continue-on-error: true
        env:
          DISCORD_CATALOG_WEBHOOK_URL: ${{ secrets.DISCORD_CATALOG_WEBHOOK_URL }}
          DISCORD_SECURITY_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK_URL }}
          DISCORD_DEFINITIONS_WEBHOOK_URL: ${{ secrets.DISCORD_DEFINITIONS_WEBHOOK_URL }}
          DISCORD_EVIDENCE_WEBHOOK_URL: ${{ secrets.DISCORD_EVIDENCE_WEBHOOK_URL }}
        run: python tools/notifications/post_discord_notice.py --notice discord-notice/discord-notice.json

