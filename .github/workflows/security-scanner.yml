name: Omega plugin security scanner

on:
  workflow_run:
    workflows:
      - "Omega SQLite catalog builder"
    types:
      - completed
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_scans:
        description: "Maximum plugin variants to scan in this run"
        type: string
        required: false
        default: "60"
      rescan_after_hours:
        description: "Re-check an unchanged artifact after this many hours"
        type: string
        required: false
        default: "168"
      max_batch_seconds:
        description: "Wall-clock budget for starting new plugin scans (0 disables)"
        type: string
        required: false
        default: "4200"
      internal_names:
        description: "Optional comma-separated InternalName allow-list for a bounded test run"
        type: string
        required: false
        default: ""

concurrency:
  group: omega-security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan due plugin artifacts
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Self-test scanner semantics and automation capability detection
        run: python tools/catalog/security_scan.py --self-test
      - name: Run scanner hardening and deterministic projection tests
        run: python tools/catalog/security_scan.py --hardening-self-test
      - name: Download builder handoff or current server-side evidence database
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p catalog/security-output
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run download "$UPSTREAM_RUN_ID" --repo "$GH_REPO" --name omega-sqlite-catalog --dir catalog/security-output
          else
            gh release download security-evidence-latest --repo "$GH_REPO" --pattern omega-security-evidence.sqlite.zip --dir catalog/security-output || true
            gh release download catalog-latest --repo "$GH_REPO" --pattern catalog.json --dir catalog/security-output
            if [ -f catalog/security-output/omega-security-evidence.sqlite.zip ]; then
              cp catalog/security-output/omega-security-evidence.sqlite.zip catalog/security-output/omega-catalog.sqlite.zip
            else
              gh release download catalog-latest --repo "$GH_REPO" --pattern omega-catalog.sqlite.zip --dir catalog/security-output
            fi
          fi
          gh release download security-evidence-latest --repo "$GH_REPO" --pattern security-scan-ledger.json --dir catalog/security-output || \
            gh release download catalog-latest --repo "$GH_REPO" --pattern security-scan-ledger.json --dir catalog/security-output || true
          test -f catalog/security-output/omega-catalog.sqlite.zip
          test -f catalog/security-output/catalog.json
          python -m zipfile -e catalog/security-output/omega-catalog.sqlite.zip catalog/security-output
      - name: Collect publicly known NuGet security risks
        run: >-
          python tools/catalog/collect_public_advisories.py
          --database catalog/security-output/omega-catalog.sqlite
          --output catalog/security-output/public-advisories.json
      - name: Incrementally scan artifacts and derive security/automation intelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/security_scan.py
          --database catalog/security-output/omega-catalog.sqlite
          --bundle catalog/security-output/omega-catalog.sqlite.zip
          --descriptor catalog/security-output/catalog.json
          --report catalog/security-output/security-report.json
          --ledger catalog/security-output/security-scan-ledger.json
          --max-scans ${{ inputs.max_scans || '60' }}
          --max-batch-seconds ${{ inputs.max_batch_seconds || '4200' }}
          --rescan-after-hours ${{ inputs.rescan_after_hours || '168' }}
          --internal-names "${{ inputs.internal_names || '' }}"
          --advisories catalog/security-output/public-advisories.json
      - name: Validate security and dependency intelligence database and hashes
        run: python tools/catalog/validate_security_catalog.py --root catalog/security-output
      - uses: actions/upload-artifact@v7
        with:
          name: omega-security-catalog
          path: |
            catalog/security-output/omega-catalog.sqlite.zip
            catalog/security-output/omega-catalog.sqlite.zip.sha256
            catalog/security-output/catalog.json
            catalog/security-output/catalog-report.json
            catalog/security-output/security-report.json
            catalog/security-output/security-scan-ledger.json
            catalog/security-output/public-advisories.json
          retention-days: 30
