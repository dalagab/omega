name: Omega SigmaScope rule candidate events

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

jobs:
  validate:
    if: >-
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, 'SigmaScope rule candidate:')
    permissions:
      contents: read
      issues: write
    uses: dalagab/omega/.github/workflows/rule-candidates.yml@sigmascope
    with:
      mode: validate
      issue_number: ${{ github.event.issue.number }}

  promote:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.issue.title, 'SigmaScope rule candidate:') &&
      startsWith(github.event.comment.body, '/promote-sigmascope-rule')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: dalagab/omega/.github/workflows/rule-candidates.yml@sigmascope
    with:
      mode: promote
      issue_number: ${{ github.event.issue.number }}
