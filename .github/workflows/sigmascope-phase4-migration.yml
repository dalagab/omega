name: Omega SigmaScope · Phase 4 automatic migration

# Default-branch registration copy.
# The authoritative implementation lives at this same path on branch `sigmascope`.
#
# In GitHub Actions:
#   Run workflow -> Branch: sigmascope
#   confirm_migration: true
#   max_workers: 4
#
# The main copy fails closed if someone accidentally runs it on main.

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "I understand this run prepares frozen inputs and may publish a new authoritative Security Evidence v2 child after every gate passes"
        required: true
        type: boolean
        default: false
      max_workers:
        description: "Parallel exact queue items to prove and migrate in this cutover run (1-8)"
        required: false
        type: number
        default: 4

permissions:
  contents: read

jobs:
  registration-only:
    name: Select the sigmascope branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop accidental main-branch migration
        shell: bash
        run: |
          echo "::error::This main-branch file only registers the Phase 4 migration in the Actions UI."
          echo "::error::Run this workflow again and select Branch = sigmascope in the Run workflow dialog."
          echo "::error::The sigmascope-branch version contains the complete automatic migration."
          exit 2
