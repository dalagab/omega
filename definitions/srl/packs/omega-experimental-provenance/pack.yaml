schema: omega.sigmascope.definition-pack.v1
id: omega-experimental-provenance
title: Omega source provenance facts
description: Experimental Stigma-1 rules that expose source attribution and source-to-artifact verification states as typed facts for later reviewed correlations.
trustTier: experimental
license: LicenseRef-Omega-First-Party
provenance:
  kind: first-party-provenance-model
  source: dalagab/omega artifact/source attribution contracts
review:
  reviewer: Omega security-services maintainers
  reviewedAtUtc: 2026-08-22T17:00:00Z
compatibility:
  minimumSrlEngineVersion: 1
  minimumObservationContractVersion: 1
  ruleSchema: omega.sigmascope.rule.v1
  fixtureSchema: omega.sigmascope.rule-fixture.v1
  observationContractSchema: omega.sigmascope.observation-contract.v1
rules:
  - path: rules/source-provenance.yaml
    ids:
      - provenance.source.identity-mismatch
      - provenance.source.version-mismatch
      - provenance.source.manifest-repository-mismatch
      - provenance.source.artifact-origin-mismatch
      - provenance.source.binary-unverified
      - provenance.source.reproducible-verified
      - provenance.source.low-attribution
      - provenance.source.very-high-attribution
    license: LicenseRef-Omega-First-Party
    provenance:
      kind: first-party-provenance-model
      source: dalagab/omega source.attribution + source.provenance observations
    review:
      reviewer: Omega security-services maintainers
      reviewedAtUtc: 2026-08-22T17:00:00Z
fixtures:
  - path: fixtures/source-provenance-positive.fixture.yaml
  - path: fixtures/source-provenance-verified.fixture.yaml
