name: Omega SRL cutover readiness

on:
  workflow_call:
    inputs:
      require_ready:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      require_ready:
        description: "Fail the job unless the complete current corpus is mechanically ready for explicit cutover review"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Replay exact published corpus against frozen SRL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout security-services audit implementation
        uses: actions/checkout@v6
        with:
          ref: sigmascope
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact frozen Catalog and Definitions
        uses: actions/checkout@v6
        with:
          ref: catalog-data
          path: catalog/active-state
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout published Security Evidence v2 read-only
        uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned security dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - name: Build read-only SRL cutover-readiness report
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --definitions-root catalog/active-state/definitions
            --evidence-v2 catalog/security-v2-current
            --output srl-cutover-readiness.json
            --summary
          )
          if [ "${{ inputs.require_ready || false }}" = "true" ]; then
            args+=(--require-ready)
          fi
          python tools/security/srl_cutover_readiness.py "${args[@]}" | tee srl-cutover-readiness-summary.json
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omega-srl-cutover-readiness
          path: |
            srl-cutover-readiness.json
            srl-cutover-readiness-summary.json
          if-no-files-found: warn
          retention-days: 30
