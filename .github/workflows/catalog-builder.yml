name: Omega SQLite catalog builder

on:
  push:
    branches: [main]
    paths:
      - "tools/catalog/**"
      - "sources/**"
      - "catalog/bootstrap/**"
      - ".github/workflows/catalog-builder.yml"
      - ".github/workflows/security-scanner.yml"
      - ".github/workflows/catalog-compaction.yml"
  schedule:
    # Four discovery/catalog passes per day; accepted source submissions still queue this workflow immediately.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel repository fetchers"
        type: string
        required: false
        default: "8"
      timeout:
        description: "Per-request timeout in seconds"
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        description: "Reuse successful website enrichment for this many hours"
        type: string
        required: false
        default: "168"

permissions:
  contents: write

concurrency:
  group: omega-sqlite-catalog-builder
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    name: Validate workflow contracts and Python units
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Run SQLite catalog self-test
        run: python tools/catalog/test_sqlite_catalog.py
      - name: Run marketplace projection self-test
        run: python tools/catalog/project_marketplace_catalog.py --self-test

  collect:
    name: 1) Discover source feeds
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Discover curated, Puni.sh and GitHub PluginMaster sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/collect_sources.py
          --curated sources/curated-sources.json
          --community sources/community-sources.json
          --output catalog/raw-sources.json
      - uses: actions/upload-artifact@v7
        with:
          name: raw-sources
          path: catalog/raw-sources.json
          retention-days: 7

  enrich:
    name: 2) Fetch and normalize manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: collect
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: raw-sources
          path: catalog/
      - name: Download previous marketplace database for conditional manifest requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --repo "$GH_REPO" --pattern omega-marketplace.sqlite.zip --dir catalog/seed || true
          if [ ! -f catalog/seed/omega-marketplace.sqlite.zip ]; then
            gh release download catalog-latest --repo "$GH_REPO" --pattern omega-catalog.sqlite.zip --dir catalog/seed || true
          fi
          bundle=""
          [ -f catalog/seed/omega-marketplace.sqlite.zip ] && bundle=catalog/seed/omega-marketplace.sqlite.zip
          [ -z "$bundle" ] && [ -f catalog/seed/omega-catalog.sqlite.zip ] && bundle=catalog/seed/omega-catalog.sqlite.zip
          if [ -n "$bundle" ]; then
            python -m zipfile -e "$bundle" catalog/seed
          fi
      - name: Fetch PluginMaster feeds
        run: >-
          python tools/catalog/enrich_metadata.py
          --input catalog/raw-sources.json
          --output catalog/enriched-sources.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --concurrency ${{ inputs.concurrency || '8' }}
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v7
        with:
          name: enriched-sources
          path: catalog/enriched-sources.json
          retention-days: 7

  scrape:
    name: 3) Incrementally enrich public project pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: enrich
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: enriched-sources
          path: catalog/
      - name: Download previous marketplace database for enrichment cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --repo "$GH_REPO" --pattern omega-marketplace.sqlite.zip --dir catalog/seed || true
          if [ ! -f catalog/seed/omega-marketplace.sqlite.zip ]; then
            gh release download catalog-latest --repo "$GH_REPO" --pattern omega-catalog.sqlite.zip --dir catalog/seed || true
          fi
          bundle=""
          [ -f catalog/seed/omega-marketplace.sqlite.zip ] && bundle=catalog/seed/omega-marketplace.sqlite.zip
          [ -z "$bundle" ] && [ -f catalog/seed/omega-catalog.sqlite.zip ] && bundle=catalog/seed/omega-catalog.sqlite.zip
          if [ -n "$bundle" ]; then
            python -m zipfile -e "$bundle" catalog/seed
          fi
      - name: Reuse fresh enrichment and scrape only new/stale project pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/scrape_websites_incremental.py
          --input catalog/enriched-sources.json
          --output catalog/website-enrichment.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --max-age-hours ${{ inputs.website_max_age_hours || '168' }}
          --concurrency 4
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v7
        with:
          name: website-enrichment
          path: catalog/website-enrichment.json
          retention-days: 7

  build:
    name: 4) Build and hand off authoritative catalog state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [collect, enrich, scrape]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: raw-sources
          path: catalog/
      - uses: actions/download-artifact@v8
        with:
          name: enriched-sources
          path: catalog/
      - uses: actions/download-artifact@v8
        with:
          name: website-enrichment
          path: catalog/
      - name: Download previous small marketplace database as catalog seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          # Security Evidence v2 is the detailed security state. The catalog builder only
          # needs the small marketplace projection for conditional/history-aware identity
          # rebuilding; it must never pull the archived multi-gigabyte v1 evidence DB.
          gh release download catalog-latest --repo "$GH_REPO" --pattern omega-marketplace.sqlite.zip --dir catalog/seed || true
      - name: Build authoritative catalog identities and presentation
        shell: bash
        run: |
          set -euo pipefail
          seed=""
          [ -f catalog/seed/omega-marketplace.sqlite.zip ] && seed=catalog/seed/omega-marketplace.sqlite.zip
          args=(
            --out catalog/dist
            --curated sources/curated-sources.json
            --community sources/community-sources.json
            --raw-sources catalog/raw-sources.json
            --enriched-sources catalog/enriched-sources.json
            --website-enrichment catalog/website-enrichment.json
            --download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
            --descriptor-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/catalog.json"
          )
          if [ -n "$seed" ]; then args+=(--seed "$seed"); fi
          python tools/catalog/build_sqlite_catalog.py "${args[@]}"
      - name: Validate generated database and transport bundle
        run: python tools/catalog/validate_base_catalog.py --root catalog/dist
      - name: Update endpoint and human-readable report only
        shell: bash
        run: |
          set -euo pipefail
          cp catalog/dist/catalog-endpoint.json catalog/catalog-endpoint.json
          cp catalog/dist/catalog-report.json catalog/latest-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog-endpoint.json catalog/latest-report.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: refresh SQLite report [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: omega-sqlite-catalog
          path: |
            catalog/dist/omega-catalog.sqlite
            catalog/dist/omega-catalog.sqlite.zip
            catalog/dist/omega-catalog.sqlite.zip.sha256
            catalog/dist/catalog.json
            catalog/dist/catalog-endpoint.json
            catalog/dist/catalog-report.json
            catalog/dist/debug/*.json
          retention-days: 30
