schema: omega.sigmascope.ruleset.v1
rules:
  - schema: omega.sigmascope.rule.v1
    id: catalog.discovery.new-plugin-needs-repository.example
    kind: observation
    status: experimental
    requires: [catalogPluginFacts]
    selectors:
      new_without_repository:
        collection: catalogPluginFacts
        where:
          classification:
            equals: new-plugin
          repoUrl:
            equals: ''
    condition: new_without_repository
    emit:
      fact: catalog.plugin.repository-needed
      confidence: medium
      title: Newly discovered plugin needs repository context
    observationRequest:
      collection: catalogRepositoryCandidates
      reason: Resolve repository candidates for a newly observed plugin without repository context.
      priority: 700
