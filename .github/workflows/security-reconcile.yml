name: Omega security services reconciliation

on:
  workflow_call:
    inputs:
      redispatch_active_leases:
        description: Redispatch already-leased work to recover a failed dispatcher boundary
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      redispatch_active_leases:
        description: Redispatch already-leased work to recover a failed dispatcher boundary
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: omega-security-work-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Settle, reconcile, lease and dispatch collector work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Checkout previous work state when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: security-work-state, path: catalog/previous-work-state, fetch-depth: 1, persist-credentials: false}
      - name: Ensure append-only RoboScope operations branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin security-operations >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          worktree="$(mktemp -d)"
          cleanup() { git worktree remove --force "$worktree" >/dev/null 2>&1 || true; rm -rf "$worktree"; }
          trap cleanup EXIT
          git worktree add --detach "$worktree" HEAD >/dev/null
          git -C "$worktree" switch --orphan security-operations
          git -C "$worktree" rm -rf . >/dev/null 2>&1 || true
          cat > "$worktree/README.md" <<'EOF'
          # Omega security operations

          Append-only RoboScope operator intent. This branch is not security evidence or catalog authority.
          EOF
          mkdir -p "$worktree/requests/scans" "$worktree/requests/sources"
          touch "$worktree/requests/scans/.gitkeep" "$worktree/requests/sources/.gitkeep"
          git -C "$worktree" add README.md requests/scans/.gitkeep requests/sources/.gitkeep
          git -C "$worktree" commit -m "Initialize RoboScope security operations state"
          if ! git -C "$worktree" push origin HEAD:refs/heads/security-operations; then
            git ls-remote --exit-code --heads origin security-operations >/dev/null 2>&1 || exit 4
          fi
      - name: Checkout RoboScope Git operations when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: security-operations, path: catalog/roboscope-operations, fetch-depth: 1, persist-credentials: false}
      - name: Checkout current authoritative catalog identity
        uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/current-catalog, fetch-depth: 1, persist-credentials: false}
      - name: Checkout catalog discovery result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: catalog-discovery-work-state, path: catalog/lane-results/catalog-discovery, fetch-depth: 1, persist-credentials: false}
      - name: Checkout catalog enrichment result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: catalog-enrichment-state, path: catalog/lane-results/catalog-enrichment, fetch-depth: 1, persist-credentials: false}
      - name: Checkout website scraper result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: catalog-scrape-state, path: catalog/lane-results/catalog-scrape, fetch-depth: 1, persist-credentials: false}
      - name: Checkout source HEAD result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: source-head-state, path: catalog/lane-results/source-head-observation, fetch-depth: 1, persist-credentials: false}
      - name: Checkout Threat Intelligence result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: threat-intelligence-state, path: catalog/lane-results/threat-intelligence, fetch-depth: 1, persist-credentials: false}
      - name: Checkout OSV result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: osv-advisory-state, path: catalog/lane-results/osv-advisories, fetch-depth: 1, persist-credentials: false}
      - name: Checkout secondary-security result when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: secondary-security-state, path: catalog/lane-results/secondary-security-definitions, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - name: Install pinned Python security dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - name: Reconcile completed results and create exact leases
        run: >-
          python tools/orchestration/reconcile_work.py
          --policy security-definitions/orchestration/work-policy.json
          --previous-root catalog/previous-work-state
          --results-root catalog/lane-results
          --catalog-root catalog/current-catalog/catalog
          --operations-root catalog/roboscope-operations
          --output catalog/work-state-next
      - name: Validate complete generated work state
        shell: bash
        run: |
          set -euo pipefail
          python tools/orchestration/reconcile_work.py validate --root catalog/work-state-next
          for queue in catalog/work-state-next/queues/*.json; do python tools/orchestration/work_queue.py validate --input "$queue"; done
          python - <<'PY'
          import json
          index=json.load(open('catalog/work-state-next/index.json'))
          assert index['securityAuthority'] is False
          assert index['clientDatabaseBuildRequested'] is False
          PY
      - name: Check whether semantic work state changed
        id: change
        shell: bash
        run: |
          set -euo pipefail
          new_revision="$(python -c "import json; print(json.load(open('catalog/work-state-next/index.json'))['workStateRevision'])")"
          old_revision=""
          if [ -f catalog/previous-work-state/index.json ]; then old_revision="$(python -c "import json; print(json.load(open('catalog/previous-work-state/index.json')).get('workStateRevision',''))")"; fi
          if [ -n "$old_revision" ] && [ "$new_revision" = "$old_revision" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No semantic orchestration-state change; skipping branch publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish queue state before dispatch
        if: steps.change.outputs.changed == 'true'
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          python tools/orchestration/publish_work_state.py --input catalog/work-state-next --repo . --branch security-work-state --push
      - name: Dispatch newly leased or explicitly recovered exact work items
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REDISPATCH_ACTIVE_LEASES: "${{ inputs.redispatch_active_leases }}"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > catalog/dispatch.tsv
          import json, os
          from pathlib import Path

          rows = list(json.load(open('catalog/work-state-next/dispatch.json')).get('dispatches', []))
          by_queue = {str(row.get('queueId') or ''): row for row in rows}

          if os.environ.get('REDISPATCH_ACTIVE_LEASES', '').lower() == 'true':
              policy = json.load(open('security-definitions/orchestration/work-policy.json'))
              for spec in policy.get('queues', []):
                  queue_id = str(spec.get('queueId') or '')
                  consumer = spec.get('consumer') or {}
                  if not consumer.get('implemented') or queue_id in by_queue:
                      continue
                  queue_path = Path('catalog/work-state-next/queues') / f'{queue_id}.json'
                  queue = json.load(open(queue_path))
                  leased = [item for item in queue.get('items', []) if item.get('state') == 'leased']
                  if len(leased) > 1:
                      raise SystemExit(f'{queue_id} has more than one active lease')
                  if not leased:
                      continue
                  item = leased[0]
                  lease = item.get('lease') or {}
                  claim = str(lease.get('claimToken') or '')
                  work_id = str(item.get('workId') or '')
                  if not work_id or not claim:
                      raise SystemExit(f'{queue_id} active lease is missing workId/claimToken')
                  row = {'queueId': queue_id, 'workId': work_id, 'claimToken': claim}
                  rows.append(row)
                  by_queue[queue_id] = row
                  print(f'# recovering active lease {queue_id} {work_id}', file=os.sys.stderr)

          for row in rows:
              print('\t'.join([row['queueId'], row['workId'], row['claimToken']]))
          PY
          while IFS=$'\t' read -r queue_id work_id claim_token; do
            [ -n "$queue_id" ] || continue
            echo "Dispatching $queue_id for $work_id through the registered orchestration router"
            dispatched=false
            for attempt in 1 2 3; do
              if gh workflow run security-orchestration-dispatch.yml \
                --repo "${{ github.repository }}" \
                --ref sigmascope \
                -f mode=worker \
                -f queue_id="$queue_id" \
                -f work_id="$work_id" \
                -f claim_token="$claim_token"; then
                dispatched=true
                break
              fi
              echo "::warning::Dispatch attempt $attempt failed for $queue_id/$work_id"
              sleep $((attempt * 5))
            done
            test "$dispatched" = true || { echo "::error::Failed to dispatch exact leased work after 3 attempts: $queue_id/$work_id"; exit 4; }
          done < catalog/dispatch.tsv
      - name: Wake release intake only for settled current-catalog manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/catalog/catalog_release_intake.py ready \
            --state catalog/current-catalog --work-state catalog/work-state-next \
            --enrichment catalog/lane-results/catalog-enrichment \
            --report catalog/release-intake-ready.json
          if [ "$(jq -r '.ready' catalog/release-intake-ready.json)" = true ]; then
            gh workflow run security-orchestration-dispatch.yml \
              --repo "${{ github.repository }}" --ref sigmascope -f mode=release-intake
          fi
