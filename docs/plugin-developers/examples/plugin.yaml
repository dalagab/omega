schema: omega.plugin-profile.v1

profile:
  tagline: Example Omega-enriched Dalamud plugin
  description: >
    Optional developer-provided context shown next to independent SigmaScope
    observations. This text does not change scanner findings.
  categories:
    - utility
  tags:
    - example
    - integration
  homepage: https://example.com
  documentation: https://example.com/docs
  support: https://example.com/support
  source: https://example.com/source
  license: MIT
  securityPolicy: https://example.com/security
  vulnerabilityReporting: https://example.com/security/report

capabilities:
  - id: network.http
    expected: true
    required: false
    reason: Retrieves optional public service data when the user enables the integration.
    destinations:
      - api.example.com

  - id: filesystem.write
    expected: true
    required: true
    reason: Stores plugin configuration and user-created presets.

  - id: process.execute
    expected: false
    required: false
    reason: This plugin does not intentionally start external processes.

services:
  - id: example-api
    name: Example API
    url: https://api.example.com
    purpose: Optional public integration used by the plugin.
    required: false

nativeComponents:
  - name: Example.Native.dll
    purpose: Example declaration for a bundled native component.
    required: false

ipc:
  - plugin: ExampleProvider
    channel: ExampleProvider.GetState
    purpose: Reads optional state supplied by another Dalamud plugin.
    required: false

media:
  icon: .omega/media/icon.png
  banner: https://example.com/omega/banner.png
  screenshots:
    - .omega/media/settings.png
