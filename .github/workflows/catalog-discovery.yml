name: Omega catalog discovery worker

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: omega-catalog-discovery
  cancel-in-progress: true

jobs:
  discover:
    name: Discover new PluginMaster and plugin facts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Checkout current canonical catalog identity
        uses: actions/checkout@v6
        with:
          ref: catalog-data
          path: catalog/current-state
          fetch-depth: 1
          persist-credentials: false
      - name: Search public JSON source candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/collect_sources.py
          --curated sources/curated-sources.json
          --community sources/community-sources.json
          --output catalog/discovery-candidates.json
      - name: Run typed discovery collectors and validate only novel source facts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: >-
          python tools/catalog/catalog_discovery.py
          --candidates catalog/discovery-candidates.json
          --catalog-root catalog/current-state/catalog
          --repository "${{ github.repository }}"
          --output catalog/discovery-snapshot
      - name: Summarize collector observation snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import json
          from pathlib import Path
          root = Path("catalog/discovery-snapshot")
          index = json.loads((root / "index.json").read_text())
          observations = json.loads((root / "observations.json").read_text())
          registry = json.loads((root / "collector-registry.json").read_text())
          print(json.dumps({"counts": index.get("counts", {}), "observationRecords": observations.get("records", 0), "collectorRegistryRevision": index.get("collectorRegistryRevision", ""), "registeredCollectors": len(registry.get("collectors", []))}, sort_keys=True))
          PY2
      - name: Publish replaceable discovery snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          python tools/catalog/publish_catalog_discovery.py \
            --input catalog/discovery-snapshot \
            --repo . \
            --branch catalog-discovery \
            --push
      - uses: actions/upload-artifact@v7
        with:
          name: omega-catalog-discovery
          path: catalog/discovery-snapshot
          if-no-files-found: error
          retention-days: 7
