name: Omega catalog · freeze launcher

on:
  workflow_dispatch:
    inputs:
      allow_source_removal:
        description: "Allow an intentional removal from the previous canonical source registry"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: read

jobs:
  freeze:
    uses: dalagab/omega/.github/workflows/catalog-freeze.yml@sigmascope
    with:
      allow_source_removal: ${{ inputs.allow_source_removal || false }}
    secrets: inherit
