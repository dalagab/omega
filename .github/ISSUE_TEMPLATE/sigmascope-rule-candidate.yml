name: SigmaScope rule candidate
description: Submit inert SRL YAML and positive/negative fixtures for validation and maintainer review.
title: "SigmaScope rule candidate: "
body:
  - type: markdown
    attributes:
      value: |
        Submit candidate SigmaScope Rule Language data here. Candidate YAML is never executed as code and a passing validator is not authorization to publish it. Promotion requires a separately permission-checked repository maintainer/developer action and opens a normal review PR.

  - type: input
    id: candidate-pack-id
    attributes:
      label: Candidate pack ID
      description: Lowercase 3-80 character Definition Pack ID using letters, numbers, dot, underscore, or hyphen. It must not already exist.
      placeholder: community-example-network
    validations:
      required: true

  - type: input
    id: candidate-pack-title
    attributes:
      label: Candidate pack title
      placeholder: Example reviewed network rules
    validations:
      required: true

  - type: textarea
    id: candidate-rule-yaml
    attributes:
      label: Candidate rule YAML
      description: One omega.sigmascope.rule.v1 rule or omega.sigmascope.ruleset.v1 ruleset exported/tested in DeltaScope Rule Lab.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: positive-fixture-yaml
    attributes:
      label: Positive fixture YAML
      description: One omega.sigmascope.rule-fixture.v1 fixture, or a YAML list of fixtures, that collectively matches every candidate rule.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: negative-fixture-yaml
    attributes:
      label: Negative fixture YAML
      description: One omega.sigmascope.rule-fixture.v1 fixture, or a YAML list of fixtures, that matches none of the candidate rules.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain the behavior/security question this candidate is intended to identify and why the existing normalized observations support it.
    validations:
      required: true

  - type: textarea
    id: false-positive-expectations
    attributes:
      label: False-positive expectations
      description: Describe expected benign matches, ambiguity, and how the fixtures/corpus review bound false positives.
    validations:
      required: true

  - type: textarea
    id: external-provenance-source
    attributes:
      label: External provenance / source
      description: Rule origin, references, corpus/research source, or upstream provenance. Do not paste secrets or private data.
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      description: License identifier or project license covering the candidate rule data.
      placeholder: MIT
    validations:
      required: true
