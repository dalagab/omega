name: Omega source submissions

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_url:
        description: "Public HTTPS Dalamud PluginMaster source URL"
        required: true
        type: string

concurrency:
  group: omega-source-submission-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'github-actions[bot]' &&
       (startsWith(github.event.issue.title, 'Source submission:') ||
        contains(github.event.issue.body, 'omega-source-submission')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ steps.outcome.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate submitted source data
        env:
          SUBMITTED_SOURCE_URL: ${{ inputs.source_url || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/catalog/process_source_submission.py
          --event "$GITHUB_EVENT_PATH"
          --sources sources/community-sources.json
          --overrides sources/source-overrides.json
          --result source-submission-result.json
          --url "$SUBMITTED_SOURCE_URL"
      - id: outcome
        name: Read validation outcome
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status source-submission-result.json)"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Comment when no repository change will be made
        if: ${{ github.event_name != 'workflow_dispatch' && steps.outcome.outputs.status != 'accepted' && steps.outcome.outputs.status != 'accepted-override' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status source-submission-result.json)"
          case "$status" in
            rejected)
              printf 'Omega could not validate the supplied URL as a readable public Dalamud PluginMaster source. Please provide a direct public HTTPS feed URL.\n' > comment.md
              ;;
            needs-url)
              jq -r .message source-submission-result.json > comment.md
              ;;
            already-added)
              jq -r .message source-submission-result.json > comment.md
              ;;
            *)
              exit 0
              ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md

  persist:
    needs: validate
    if: ${{ needs.validate.outputs.status == 'accepted' || needs.validate.outputs.status == 'accepted-override' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Revalidate and materialize the accepted source change
        env:
          SUBMITTED_SOURCE_URL: ${{ inputs.source_url || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/catalog/process_source_submission.py
          --event "$GITHUB_EVENT_PATH"
          --sources sources/community-sources.json
          --overrides sources/source-overrides.json
          --result source-submission-result.json
          --url "$SUBMITTED_SOURCE_URL"
      - name: Commit only validated source metadata
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status source-submission-result.json)"
          if [ "$status" != "accepted" ] && [ "$status" != "accepted-override" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sources/community-sources.json sources/source-overrides.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "catalog: persist validated source metadata [skip ci]"
          branch="${{ github.event.repository.default_branch || github.ref_name }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
      - name: Record daily processing boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status source-submission-result.json)"
          if [ "$status" = "accepted" ] || [ "$status" = "accepted-override" ]; then
            echo "Accepted source metadata is durable immediately and will enter the next daily catalog/Definitions snapshot."
            echo "Use the manual catalog workflow only when an operator deliberately wants an out-of-cycle publication."
          fi
      - name: Confirm accepted source change
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r .status source-submission-result.json)"
          if [ "$status" = "accepted" ]; then
            printf 'Omega validated and scraped this PluginMaster source and persisted it disabled-by-default. It will enter the next daily catalog/Definitions snapshot; an operator may run that workflow manually when an out-of-cycle publication is deliberately required.\n' > comment.md
            gh issue close "$ISSUE_NUMBER" --comment "$(cat comment.md)"
          elif [ "$status" = "accepted-override" ]; then
            printf 'Omega validated this public source repository against the plugin identity and persisted the source-repository override. It will enter the next daily Definitions/catalog snapshot and then become eligible for continuous Sigmascope review.\n' > comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          else
            exit 0
          fi
