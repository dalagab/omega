name: Omega SigmaScope · Phase 4 automatic migration

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: I understand this run prepares frozen inputs and may publish a new authoritative Security Evidence v2 child after every gate passes
        required: true
        type: boolean
        default: false
      max_workers:
        description: Parallel exact queue items to prove and migrate in this cutover run (1-8)
        required: false
        type: number
        default: 4

# One-time Phase-4 commissioning owns the global catalog/Evidence writer mutex for the complete
# run. Holding it during image preparation and collector settlement is intentionally conservative:
# collectors may continue on their independent lanes, while no authoritative Evidence/catalog
# writer can advance between preparation, freeze, proof, publication and final verification.
concurrency:
  group: omega-catalog-sigmascope-exclusive
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write
  issues: write
  packages: write

jobs:
  validate-request:
    name: Validate migration request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require explicit acknowledgement and bounded worker count
        env:
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
          MAX_WORKERS: ${{ inputs.max_workers }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_MIGRATION" = "true" || { echo "::error::Set confirm_migration=true to run the authoritative Phase-4 migration."; exit 2; }
          [[ "$MAX_WORKERS" =~ ^[0-9]+$ ]] || { echo "::error::max_workers must be an integer from 1 through 8."; exit 2; }
          test "$MAX_WORKERS" -ge 1 -a "$MAX_WORKERS" -le 8 || { echo "::error::max_workers must be from 1 through 8."; exit 2; }

  prepare-worker-images:
    name: Build and publish current digest-pinned worker images
    needs: validate-request
    uses: ./.github/workflows/worker-images.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit

  bootstrap-operational-state:
    name: Bootstrap and dispatch Phase-3 collector state
    needs: prepare-worker-images
    uses: ./.github/workflows/security-reconcile.yml
    permissions:
      contents: write
      actions: write
    with:
      redispatch_active_leases: true
    secrets: inherit

  wait-for-operational-state:
    name: Wait for all required collector lanes to settle
    needs: bootstrap-operational-state
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Wait for freezeable durable work state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/security-work-state"
          rm -rf "$state_dir"
          git init -q "$state_dir"
          git -C "$state_dir" remote add origin "https://github.com/${{ github.repository }}.git"
          gh auth setup-git

          for attempt in $(seq 1 270); do
            echo "Phase-3 settlement check $attempt/270"
            git -C "$state_dir" fetch --force --no-tags --depth=1 origin refs/heads/security-work-state
            git -C "$state_dir" reset --hard -q FETCH_HEAD

            set +e
            python tools/orchestration/work_state_readiness.py \
              --work-state "$state_dir" \
              --policy security-definitions/orchestration/work-policy.json \
              --output "$RUNNER_TEMP/work-state-readiness.json"
            status=$?
            set -e

            cat "$RUNNER_TEMP/work-state-readiness.json"
            if [ "$status" -eq 0 ]; then
              cat "$RUNNER_TEMP/work-state-readiness.json" >> "$GITHUB_STEP_SUMMARY"
              echo "All implemented collector queues are settled and ready for the freeze boundary."
              exit 0
            fi
            if [ "$status" -eq 20 ]; then
              cat "$RUNNER_TEMP/work-state-readiness.json" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::A required collector queue reached blocked/terminal state. Refusing Phase-4 migration."
              exit 20
            fi
            if [ "$status" -ne 10 ]; then
              echo "::error::Unexpected work-state readiness exit code: $status"
              exit "$status"
            fi
            # Worker completions normally wake the reconciler themselves. Re-dispatch it
            # periodically as a recovery path for delayed retries or a missed wake-up.
            if [ $((attempt % 6)) -eq 0 ]; then
              gh workflow run security-orchestration-dispatch.yml --repo "${{ github.repository }}" --ref "${GITHUB_REF_NAME}" -f mode=reconcile
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the Phase-3 collector lanes to settle."
          exit 21

  freeze-current-definitions:
    name: Freeze coherent catalog/Definitions under the migration authority lock
    needs: wait-for-operational-state
    uses: ./.github/workflows/catalog-freeze.yml
    permissions:
      contents: write
      packages: read
    with:
      allow_source_removal: false
      authority_lock_held: true
      publish_client: false
    secrets: inherit

  prerequisites:
    name: Prove prepared automatic-cutover prerequisites
    needs: freeze-current-definitions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      shadow_count: ${{ steps.shadow-plan.outputs.count }}
      sigmascope_image: ${{ steps.images.outputs.sigmascope_image }}
    steps:
      - name: Require explicit cutover acknowledgement
        env:
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
          MAX_WORKERS: ${{ inputs.max_workers }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_MIGRATION" = "true" || { echo "::error::Set confirm_migration=true to run the authoritative Phase-4 cutover."; exit 2; }
          [[ "$MAX_WORKERS" =~ ^[0-9]+$ ]] || { echo "::error::max_workers must be an integer from 1 through 8."; exit 2; }
          test "$MAX_WORKERS" -ge 1 -a "$MAX_WORKERS" -le 8 || { echo "::error::max_workers must be from 1 through 8."; exit 2; }
      - uses: actions/checkout@v6
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/active-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: security-evidence-v2, path: catalog/security-v2-current, fetch-depth: 2, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: security-worker-images, path: image-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - name: Install pinned Python security dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - id: images
        name: Require all immutable Phase-4 worker images
        shell: bash
        run: |
          set -euo pipefail
          sigmascope_ref=""
          for image in catalog-worker sigmascope-worker intelligence-worker publisher-worker; do
            ref="$(jq -r --arg image "$image" '.images[$image] // empty' image-state/index.json)"
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::security-worker-images is missing a digest-pinned $image image."; exit 3; }
            if [ "$image" = "sigmascope-worker" ]; then
              sigmascope_ref="$ref"
            fi
          done
          test -n "$sigmascope_ref"
          echo "sigmascope_image=$sigmascope_ref" >> "$GITHUB_OUTPUT"
      - name: Require newly frozen fast-forward-capable Definitions worker
        shell: bash
        run: |
          set -euo pipefail
          publisher=catalog/active-state/definitions/worker/tools/security/publish_security_evidence_v2.py
          history=catalog/active-state/definitions/worker/tools/orchestration/git_snapshot_history.py
          test -f "$publisher" -a -f "$history" || { echo "::error::Frozen Definitions worker predates the Git-history/Phase-4C cutover. Freeze Definitions first."; exit 4; }
          grep -q -- '--history-mode' "$publisher"
          grep -q -- '--expected-parent-sha' "$publisher"
          grep -q -- '--parallel-authorization-report' "$publisher"
      - id: shadow-plan
        name: Require at least one exact real-corpus assignment
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/sigmascope_parallel_plan.py \
            --queue-seed catalog/active-state/scan-queue.json \
            --evidence-root catalog/security-v2-current \
            --max-assignments "${{ inputs.max_workers }}" \
            --output catalog/sigmascope-parallel-plan.json
          count="$(jq -r '.assignmentCount' catalog/sigmascope-parallel-plan.json)"
          test "$count" -gt 0 || { echo "::error::No eligible real-corpus artifact/source queue item is currently available for Phase-4 equivalence proof."; exit 5; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-parallel-plan
          path: catalog/sigmascope-parallel-plan.json
          retention-days: 30
      - name: Summarize locked migration base
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Phase 4 automatic cutover base"
            echo "- Evidence head: \`$(git -C catalog/security-v2-current rev-parse HEAD)\`"
            echo "- Definitions: \`$(jq -r '.definitionsRevision' catalog/active-state/definitions/index.json)\`"
            echo "- Maximum parallel workers: \`${{ inputs.max_workers }}\`"
            echo "- Global Evidence writer mutex: held by the complete migration workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep Phase-4B inside this top-level workflow. GitHub repeatedly rejected the reusable
  # shadow expansion before creating any runner jobs; a literal matrix here preserves the
  # same exact-queue-key proof without another workflow-evaluation boundary.
  shadow-workers:
    name: Phase-4B exact result bundle (slot ${{ matrix.slot }})
    needs: prerequisites
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prerequisites.outputs.sigmascope_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-parallel-plan
          path: catalog/parallel-plan-artifact
      - id: assignment
        name: Resolve exact queue key for this static slot
        shell: bash
        run: |
          set -euo pipefail
          queue_key="$(jq -r --argjson slot "${{ matrix.slot }}" '.assignments[$slot].queueKey // ""' catalog/parallel-plan-artifact/sigmascope-parallel-plan.json)"
          if [ -z "$queue_key" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Static slot ${{ matrix.slot }} is inactive for this plan."
            exit 0
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "queue_key=$queue_key" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.assignment.outputs.active == 'true'
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        if: steps.assignment.outputs.active == 'true'
        with: {ref: catalog-data, path: catalog/active-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        if: steps.assignment.outputs.active == 'true'
        with: {ref: security-evidence-v2, path: catalog/security-v2-current, fetch-depth: 1, persist-credentials: false}
      - name: Build exact non-authoritative result bundle
        if: steps.assignment.outputs.active == 'true'
        run: >-
          python tools/security/sigmascope_phase4b_inline_worker.py
          --queue-key "${{ steps.assignment.outputs.queue_key }}"
          --worker-image "${{ needs.prerequisites.outputs.sigmascope_image }}"
          --output catalog/sigmascope-result-bundle
      - uses: actions/upload-artifact@v7
        if: steps.assignment.outputs.active == 'true'
        with:
          name: omega-sigmascope-result-slot-${{ matrix.slot }}
          path: catalog/sigmascope-result-bundle
          if-no-files-found: error
          retention-days: 30

  shadow-merge:
    name: Validate and prove Phase-4B merged candidate
    needs: [prerequisites, shadow-workers]
    if: needs.shadow-workers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prerequisites.outputs.sigmascope_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/active-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: security-evidence-v2, path: catalog/security-v2-current, fetch-depth: 1, persist-credentials: false}
      - name: Checkout previous Deep Scan state when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/deep-scan-current
          if git ls-remote --exit-code --heads origin deep-scan-state >/dev/null 2>&1; then
            git fetch --depth=1 origin deep-scan-state
            git archive FETCH_HEAD | tar -x -C catalog/deep-scan-current
          fi
      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-parallel-plan
          path: catalog/parallel-plan-artifact
      - uses: actions/download-artifact@v8
        with:
          pattern: omega-sigmascope-result-*
          path: catalog/result-bundles
      - name: Rebuild merged candidate and prove serialized equivalence
        run: >-
          python tools/security/sigmascope_phase4b_inline_merge.py
          --plan catalog/parallel-plan-artifact/sigmascope-parallel-plan.json
          --bundles-root catalog/result-bundles
          --source-run-id "${{ github.run_id }}"
          --source-run-attempt "${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-merged-candidate-validation
          path: |
            catalog/sigmascope-merge-report.json
            catalog/security-v2-merge-work/merge-plan.json
            catalog/security-v2-merged-candidate/index.json
            catalog/security-v2-merged-candidate/validation-report.json
            catalog/sigmascope-parallel-equivalence.json
            catalog/sigmascope-parallel-developer-audit.json
            catalog/sigmascope-parallel-storage-audit.json
            catalog/sigmascope-parallel-preflight.json
            catalog/security-v2-merge-work/sigmascope-source-followups.json
            catalog/security-v2-merge-work/deep-scan-state/index.json
            catalog/security-v2-serial-source-followups.json
            catalog/security-v2-serial-deep/index.json
          if-no-files-found: error
          retention-days: 30

  authorize-and-publish:
    name: Authorize and perform one-writer cutover
    needs: shadow-merge
    uses: ./.github/workflows/sigmascope-parallel-publish.yml
    permissions:
      contents: write
      actions: write
      issues: write
      packages: read
    with:
      use_current_run_artifacts: true
      confirm_publish: true
    secrets: inherit

  verify:
    name: Verify authoritative child and deferred state
    needs: authorize-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: security-evidence-v2, path: catalog/security-v2-current, fetch-depth: 2, persist-credentials: false}
      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-phase4c-authorized-candidate
          path: catalog/authorized-publication
      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-phase4c-publication-receipt
          path: catalog/publication-receipt
      - name: Rehydrate exact authorized candidate
        shell: bash
        run: |
          set -euo pipefail
          cd catalog/authorized-publication
          sha256sum -c security-v2-authorized-candidate.tar.gz.sha256
          mkdir candidate
          tar -xzf security-v2-authorized-candidate.tar.gz -C candidate
      - name: Verify Evidence is the exact authorized immediate child
        shell: bash
        run: |
          set -euo pipefail
          head="$(git -C catalog/security-v2-current rev-parse HEAD)"
          parent="$(git -C catalog/security-v2-current rev-parse HEAD^ 2>/dev/null || true)"
          python tools/security/sigmascope_parallel_publish_gate.py check-current \
            --authorization catalog/authorized-publication/sigmascope-phase4c-authorization.json \
            --candidate catalog/authorized-publication/candidate \
            --current-evidence catalog/security-v2-current \
            --current-head "$head" \
            --current-parent "$parent" \
            --deep-scan-index catalog/authorized-publication/security-v2-authorize-work/deep-scan-state/index.json \
            --source-followups catalog/authorized-publication/security-v2-authorize-work/sigmascope-source-followups.json \
            --output catalog/phase4-migration-post-publication-state.json
          state="$(jq -r '.state' catalog/phase4-migration-post-publication-state.json)"
          if [ "$state" = "already-published-immediate-child" ]; then
            exit 0
          fi
          if [ "$state" = "ready-to-publish" ]; then
            receipt=catalog/publication-receipt/evidence-history-publication.json
            test "$(jq -r '.noOp // false' "$receipt")" = "true" || { echo "::error::Evidence remained on the authorized parent without an explicit identical-tree no-op receipt."; exit 7; }
            test "$(jq -r '.pushed // false' "$receipt")" = "false" || { echo "::error::A no-op Evidence publication cannot report pushed=true."; exit 7; }
            current_index="$(sha256sum catalog/security-v2-current/index.json | awk '{print $1}')"
            candidate_index="$(sha256sum catalog/authorized-publication/candidate/index.json | awk '{print $1}')"
            test "$current_index" = "$candidate_index" || { echo "::error::No-op publication did not preserve the exact authorized candidate tree."; exit 7; }
            exit 0
          fi
          echo "::error::Unexpected Phase-4 post-publication state: $state"
          exit 7
      - name: Verify authorized Deep Scan state was published after Evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf catalog/deep-scan-published
          mkdir -p catalog/deep-scan-published
          git fetch --depth=1 origin deep-scan-state
          git archive FETCH_HEAD | tar -x -C catalog/deep-scan-published
          expected="$(jq -r '.sideEffects.deepScan.sha256' catalog/authorized-publication/sigmascope-phase4c-authorization.json)"
          observed="$(sha256sum catalog/deep-scan-published/index.json | awk '{print $1}')"
          test "$expected" = "$observed" || { echo "::error::Published Deep Scan state does not match the authorized deferred payload."; exit 6; }
      - name: Build durable automatic-cutover receipt
        shell: bash
        run: |
          set -euo pipefail
          auth=catalog/authorized-publication/sigmascope-phase4c-authorization.json
          state=catalog/phase4-migration-post-publication-state.json
          publication=catalog/publication-receipt/evidence-history-publication.json
          mkdir -p catalog/phase4-migration-receipt
          publication_state="$(jq -r '.state' "$state")"
          pushed="$(jq -r '.pushed // false' "$publication")"
          no_op="$(jq -r '.noOp // false' "$publication")"
          if [ "$publication_state" = "already-published-immediate-child" ]; then
            result="published-authorized-immediate-child"
          elif [ "$publication_state" = "ready-to-publish" ] && [ "$no_op" = "true" ]; then
            result="authorized-identical-tree-no-op"
          else
            echo "::error::Cannot classify final Phase-4 migration state." >&2
            exit 8
          fi
          jq -n \
            --arg schema "omega.sigmascope-phase4-migration.v1" \
            --arg status "complete" \
            --arg result "$result" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg preflightRevision "$(jq -r '.preflightRevision' "$auth")" \
            --arg authorizationRevision "$(jq -r '.authorizationRevision' "$auth")" \
            --arg expectedParentHead "$(jq -r '.expectedParentHead' "$auth")" \
            --arg evidenceHead "$(jq -r '.currentHead' "$state")" \
            --arg evidenceIndexSha256 "$(jq -r '.currentIndexSha256' "$state")" \
            --arg deepScanSha256 "$(jq -r '.sideEffects.deepScan.sha256' "$auth")" \
            --arg publicationState "$publication_state" \
            --argjson maxWorkers "${{ inputs.max_workers }}" \
            --argjson pushed "$pushed" \
            --argjson noOp "$no_op" \
            '{schema:$schema,status:$status,result:$result,sourceRun:{id:$runId,attempt:$runAttempt},maxWorkers:$maxWorkers,preflightRevision:$preflightRevision,authorizationRevision:$authorizationRevision,expectedParentHead:$expectedParentHead,evidenceHead:$evidenceHead,evidenceIndexSha256:$evidenceIndexSha256,deepScanSha256:$deepScanSha256,publicationState:$publicationState,pushed:$pushed,noOp:$noOp,authority:"phase4-automatic-cutover-receipt"}' \
            > catalog/phase4-migration-receipt/receipt.json
          {
            echo "### Phase 4 automatic cutover complete"
            echo "- Preflight: \`$(jq -r '.preflightRevision' "$auth")\`"
            echo "- Authorization: \`$(jq -r '.authorizationRevision' "$auth")\`"
            echo "- Evidence head: \`$(jq -r '.currentHead' "$state")\`"
            echo "- Result: \`$result\`"
            echo "- Post-publication state: \`$publication_state\`"
            echo "- Deep Scan payload: exact authorized hash verified"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-phase4-migration-receipt
          path: |
            catalog/phase4-migration-receipt/receipt.json
            catalog/phase4-migration-post-publication-state.json
            catalog/publication-receipt/evidence-history-publication.json
          if-no-files-found: error
          retention-days: 90

  publish-customer-catalog:
    name: Publish Omega customer database from verified authoritative state
    needs: verify
    uses: ./.github/workflows/catalog-client-publish.yml
    permissions:
      contents: write
      packages: read
    with:
      authority_lock_held: true
    secrets: inherit
