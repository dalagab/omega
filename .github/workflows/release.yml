name: Publish Omega release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.8.54"
        required: true
        type: string

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  # Every release updates the shared omega-latest endpoint, so publication must be serialized across tags.
  group: omega-release-stable
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish Omega
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Release tag '$tag' must look like v0.8.54" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"


      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download current Dalamud runtime
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile 'dalamud.zip'
          Expand-Archive 'dalamud.zip' -DestinationPath $dalamudHome -Force
          Remove-Item 'dalamud.zip'

      - name: Verify project version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'Omega/DalagabOmega.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $tagVersion = '${{ steps.release.outputs.version }}'
          if ($projectVersion -ne $tagVersion) { throw "Project version $projectVersion does not match tag $tagVersion" }

      - name: Build release notes from CHANGELOG.md
        shell: pwsh
        run: python tools/release/extract_changelog.py --version '${{ steps.release.outputs.version }}' --output release-notes.md

      - name: Stage current published catalog bootstrap
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path 'catalog/bootstrap' | Out-Null
          gh release download catalog-latest --repo '${{ github.repository }}' --pattern 'omega-marketplace.sqlite.zip' --pattern 'omega-marketplace.sqlite.zip.sha256' --dir 'catalog/bootstrap'
          $expected = ((Get-Content 'catalog/bootstrap/omega-marketplace.sqlite.zip.sha256' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash 'catalog/bootstrap/omega-marketplace.sqlite.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Published catalog bootstrap SHA-256 mismatch: expected $expected, got $actual" }

      - name: Build and run regression suite
        run: dotnet build .\Omega.sln -c Release

      - name: Assemble Dalamud package
        id: package
        shell: pwsh
        run: |
          $candidate = Get-ChildItem -Path 'Omega/bin' -Filter 'latest.zip' -Recurse -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'Dalamud.NET.Sdk did not produce latest.zip under Omega/bin.' }
          $extract = Join-Path $env:RUNNER_TEMP 'omega-package-check'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive $candidate.FullName -DestinationPath $extract -Force

          # Dalamud plugins execute as Windows x64 binaries even when XIVLauncher itself is hosted by
          # Wine/Proton. Keep e_sqlite3 beside the plugin assembly so DllImport never relies on a host
          # winsqlite3.dll implementation being present.
          $nativeSqlite = Get-ChildItem -Path 'Omega/bin' -Filter 'e_sqlite3.dll' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]win-x64[\\/]' -or $_.DirectoryName -eq (Split-Path $candidate.FullName) } |
            Select-Object -First 1
          if ($null -eq $nativeSqlite) {
            $nativeSqlite = Get-ChildItem -Path 'Omega/bin' -Filter 'e_sqlite3.dll' -Recurse -File | Select-Object -First 1
          }
          if ($null -eq $nativeSqlite) { throw 'Build output is missing the bundled e_sqlite3.dll runtime.' }
          Copy-Item $nativeSqlite.FullName (Join-Path $extract 'e_sqlite3.dll') -Force

          foreach ($required in @('DalagabOmega.dll','DalagabOmega.json','omega-catalog.sqlite.zip','Microsoft.Data.Sqlite.dll','SQLitePCLRaw.core.dll','SQLitePCLRaw.provider.e_sqlite3.dll','e_sqlite3.dll')) {
            if (-not (Get-ChildItem $extract -Filter $required -Recurse -File)) { throw "Omega.zip is missing $required" }
          }

          if (Test-Path 'Omega.zip') { Remove-Item 'Omega.zip' -Force }
          Compress-Archive -Path (Join-Path $extract '*') -DestinationPath 'Omega.zip' -CompressionLevel Optimal
          $packagedManifestPath = (Get-ChildItem $extract -Filter 'DalagabOmega.json' -Recurse -File | Select-Object -First 1).FullName
          $packagedManifest = Get-Content $packagedManifestPath -Raw | ConvertFrom-Json
          $distributedVersion = [string]$packagedManifest.AssemblyVersion
          $expectedAssemblyVersion = '${{ steps.release.outputs.version }}.0'
          if ($distributedVersion -ne $expectedAssemblyVersion) {
            throw "Distributed plugin version $distributedVersion does not match release tag assembly version $expectedAssemblyVersion"
          }
          $hash = (Get-FileHash 'Omega.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Omega.zip" | Set-Content 'Omega.zip.sha256' -Encoding ascii
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append


      - name: Generate PluginMaster from packaged Omega.zip
        shell: pwsh
        run: >-
          python tools/release/generate_pluginmaster.py
          --template repository/pluginmaster.template.json
          --package Omega.zip
          --tag '${{ steps.release.outputs.tag }}'
          --release-notes release-notes.md
          --output pluginmaster.json

      - name: Attest Omega.zip build provenance
        uses: actions/attest@v4
        with:
          subject-path: Omega.zip

      - name: Publish immutable versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          if (-not (gh release view $tag *> $null)) {
            gh release create $tag Omega.zip Omega.zip.sha256 pluginmaster.json --verify-tag --notes-file release-notes.md --title "Omega ${{ steps.release.outputs.version }}"
          } else {
            # A tagged package is immutable once present. A rerun may fill in a missing
            # sidecar/manifest, but it must never replace different bytes for an existing asset.
            $assets = (gh release view $tag --json assets | ConvertFrom-Json).assets
            $verify = Join-Path $env:RUNNER_TEMP 'omega-existing-versioned-assets'
            if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $verify | Out-Null
            foreach ($assetName in @('Omega.zip','Omega.zip.sha256','pluginmaster.json')) {
              $local = Resolve-Path $assetName
              if (@($assets | Where-Object { $_.name -eq $assetName }).Count -eq 0) {
                gh release upload $tag $assetName
                continue
              }
              gh release download $tag --pattern $assetName --dir $verify
              $remote = Join-Path $verify $assetName
              $localHash = (Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()
              $remoteHash = (Get-FileHash $remote -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($localHash -ne $remoteHash) {
                throw "Immutable release $tag already contains different bytes for $assetName ($remoteHash != $localHash). Refusing to clobber the tagged release."
              }
            }
          }
          gh release edit $tag --notes-file release-notes.md --title "Omega ${{ steps.release.outputs.version }}"

      - name: Verify immutable versioned release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $verify = Join-Path $env:RUNNER_TEMP 'omega-versioned-release-verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $tag --pattern 'Omega.zip' --dir $verify
          $downloaded = Join-Path $verify 'Omega.zip'
          $expectedHash = '${{ steps.package.outputs.sha256 }}'
          $actualHash = (Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Published $tag/Omega.zip SHA-256 $actualHash does not match built package $expectedHash" }
          $extract = Join-Path $verify 'extract'
          Expand-Archive $downloaded -DestinationPath $extract -Force
          $packagedManifestPath = (Get-ChildItem $extract -Filter 'DalagabOmega.json' -Recurse -File | Select-Object -First 1).FullName
          if (-not $packagedManifestPath) { throw 'Published immutable Omega.zip is missing DalagabOmega.json' }
          $packagedManifest = Get-Content $packagedManifestPath -Raw | ConvertFrom-Json
          $generated = Get-Content 'pluginmaster.json' -Raw | ConvertFrom-Json
          if ([string]$packagedManifest.AssemblyVersion -ne [string]$generated[0].AssemblyVersion) {
            throw "Published immutable package version $($packagedManifest.AssemblyVersion) does not match generated PluginMaster $($generated[0].AssemblyVersion)"
          }

      - name: Publish stable generated Dalamud feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (gh release view omega-latest *> $null)) {
            gh release create omega-latest --target '${{ github.sha }}' --title 'Omega latest stable' --notes 'Stable generated Dalamud feed. PluginMaster points to an immutable tagged Omega.zip.'
          }
          # Keep mirrored package assets for humans/legacy links, but the generated PluginMaster
          # points to the immutable vX.Y.Z release so a partial omega-latest upload cannot mismatch.
          gh release upload omega-latest pluginmaster.json Omega.zip Omega.zip.sha256 --clobber
          gh release edit omega-latest --title 'Omega latest stable (${{ steps.release.outputs.version }})' --notes-file release-notes.md

      - name: Verify stable generated Dalamud feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'omega-stable-feed-verify'
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download omega-latest --pattern 'pluginmaster.json' --dir $verify
          $downloaded = Join-Path $verify 'pluginmaster.json'
          $expectedHash = (Get-FileHash 'pluginmaster.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualHash = (Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Published omega-latest/pluginmaster.json SHA-256 $actualHash does not match generated manifest $expectedHash" }
          $manifest = Get-Content $downloaded -Raw | ConvertFrom-Json
          $expectedUrl = 'https://github.com/dalagab/omega/releases/download/${{ steps.release.outputs.tag }}/Omega.zip'
          if ([string]$manifest[0].DownloadLinkInstall -ne $expectedUrl -or [string]$manifest[0].DownloadLinkUpdate -ne $expectedUrl) {
            throw 'Stable generated PluginMaster does not point to the immutable tagged Omega.zip.'
          }
      - name: Finalize tagged changelog on default branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $defaultBranch = '${{ github.event.repository.default_branch }}'
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) {
            Write-Warning 'Repository default branch is unavailable; release is published but CHANGELOG.md was not rolled forward.'
            exit 0
          }

          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $remoteLine = (git ls-remote origin "refs/heads/$defaultBranch" | Select-Object -First 1)
          $remoteHead = if ($remoteLine) { ($remoteLine -split "`t")[0].Trim() } else { '' }
          if ($remoteHead -ne $tagCommit) {
            Write-Warning "Default branch '$defaultBranch' moved beyond tagged commit $tagCommit; skipping automatic changelog finalization so post-tag Unreleased work cannot be misassigned."
            exit 0
          }

          git checkout -B $defaultBranch $tagCommit
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          python tools/release/finalize_changelog.py --version $version --date $releaseDate
          if (-not (git status --porcelain -- CHANGELOG.md)) {
            Write-Host 'CHANGELOG.md is already finalized for this version.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "Finalize changelog for $tag"
          git push origin "HEAD:refs/heads/$defaultBranch"

      - name: Publish legacy raw-main PluginMaster compatibility mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $defaultBranch = '${{ github.event.repository.default_branch }}'
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) { throw 'Repository default branch is unavailable.' }
          $endpoint = "repos/$env:GITHUB_REPOSITORY/contents/repository/pluginmaster.json"
          $current = gh api "${endpoint}?ref=$defaultBranch" | ConvertFrom-Json
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes((Resolve-Path 'pluginmaster.json')))
          $payload = @{
            message = "Publish generated PluginMaster for ${{ steps.release.outputs.tag }} [skip ci]"
            content = $content
            sha = [string]$current.sha
            branch = $defaultBranch
          } | ConvertTo-Json -Depth 4
          $payloadPath = Join-Path $env:RUNNER_TEMP 'omega-pluginmaster-publish.json'
          [System.IO.File]::WriteAllText($payloadPath, $payload, [System.Text.UTF8Encoding]::new($false))
          gh api --method PUT $endpoint --input $payloadPath | Out-Null

      - name: Queue Definitions rebuild for published Omega feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $defaultBranch = '${{ github.event.repository.default_branch }}'
          gh workflow run catalog-builder.yml --ref $defaultBranch
