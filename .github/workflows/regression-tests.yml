name: Omega client regression tests

on:
  push:
    branches: [main]
    paths:
      - "Omega/**"
      - "Omega.RegressionTests/**"
      - "Omega.sln"
      - "EULA.md"
      - "CHANGELOG.md"
      - "catalog/catalog-endpoint.json"
      - "sources/curated-sources.json"
      - "images/**"
      - ".github/workflows/regression-tests.yml"
  pull_request:
    paths:
      - "Omega/**"
      - "Omega.RegressionTests/**"
      - "Omega.sln"
      - "EULA.md"
      - "CHANGELOG.md"
      - "catalog/catalog-endpoint.json"
      - "sources/curated-sources.json"
      - "images/**"
      - ".github/workflows/regression-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Download current Dalamud runtime
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile 'dalamud.zip'
          Expand-Archive 'dalamud.zip' -DestinationPath $dalamudHome -Force
          Remove-Item 'dalamud.zip'
      - name: Build and run Omega client regression suite
        shell: pwsh
        run: dotnet build .\Omega.sln -c Release
