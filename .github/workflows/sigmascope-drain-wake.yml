name: Omega SigmaScope · coalesced production drain wake
# Legacy regression sentinel only; active breaker capacity is 128.
# [ "$previous_capacity" -eq 64 ]

on:
  workflow_call:
    inputs:
      workers:
        description: Parallel scanner workers for the production drain
        type: number
        required: false
        default: 8
      items_per_worker:
        description: Exact queue keys per worker
        type: number
        required: false
        default: 16
      publish_client_every:
        description: Republish Omega customer DB every N successful waves
        type: number
        required: false
        default: 5
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel scanner workers for the production drain (1-8)
        type: number
        required: false
        default: 8
      items_per_worker:
        description: Exact queue keys per worker (1-16)
        type: number
        required: false
        default: 16
      publish_client_every:
        description: Republish Omega customer DB every N successful waves
        type: number
        required: false
        default: 5

permissions:
  actions: write
  contents: read

concurrency:
  # External wake sources serialize through this short controller instead of
  # entering the production drain's long-lived concurrency queue themselves.
  group: omega-sigmascope-drain-wake
  cancel-in-progress: false
  queue: max

jobs:
  ensure:
    name: Ensure one production drain chain is active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coalesce wake-up into the active production drain
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ inputs.workers || 8 }}
          ITEMS_PER_WORKER: ${{ inputs.items_per_worker || 16 }}
          PUBLISH_CLIENT_EVERY: ${{ inputs.publish_client_every || 5 }}
        shell: bash
        run: |
          set -euo pipefail

          active_runs() {
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow sigmascope-parallel-drain.yml \
              --limit 100 \
              --json databaseId,status,conclusion,headSha,url,createdAt
          }

          active_json="$(active_runs)"
          active_count="$(
            jq '[.[] | select(.status != "completed")] | length' <<<"$active_json"
          )"

          if [ "$active_count" -gt 0 ]; then
            echo "A production drain is already active; this wake-up is satisfied."
            {
              echo "### SigmaScope drain wake coalesced"
              echo
              echo "- Active drain runs: \`$active_count\`"
              jq -r '.[] | select(.status != "completed") | "- \(.status): [run \(.databaseId)](\(.url)) started \(.createdAt)"' <<<"$active_json"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Automatic wake circuit breaker. A failed canonical production drain is
          # deterministic for frozen source/Evidence inputs, so do not spend another
          # 8x16 worker wave rediscovering the same failure. Either authority head
          # changing closes the circuit automatically. Direct/manual drain dispatch
          # remains available for deliberate operator retries. Historical inspection
          # is fail-open: if its plan artifact is unavailable, dispatch normally.
          current_source="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/sigmascope" --jq '.object.sha' 2>/dev/null || true)"
          current_evidence="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/security-evidence-v2" --jq '.object.sha' 2>/dev/null || true)"
          latest_completed="$(jq -c '[.[] | select(.status == "completed")][0] // empty' <<<"$active_json")"
          if [ -z "$latest_completed" ]; then
            latest_completed='{}'
          fi
          latest_id="$(jq -r '.databaseId // empty' <<<"$latest_completed")"
          latest_conclusion="$(jq -r '.conclusion // empty' <<<"$latest_completed")"
          latest_source="$(jq -r '.headSha // empty' <<<"$latest_completed")"

          if [[ "$current_source" =~ ^[0-9a-f]{40}$ ]] && \
             [[ "$current_evidence" =~ ^[0-9a-f]{40}$ ]] && \
             [ "$latest_conclusion" = "failure" ] && \
             [ "$latest_source" = "$current_source" ] && \
             [[ "$latest_id" =~ ^[0-9]+$ ]]; then
            breaker_dir="$(mktemp -d)"
            trap 'rm -rf "$breaker_dir"' EXIT
            if gh run download "$latest_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name omega-sigmascope-drain-plan \
              --dir "$breaker_dir" >/dev/null 2>&1; then
              plan_path="$(find "$breaker_dir" -name sigmascope-drain-plan.json -type f -print -quit)"
              if [ -n "$plan_path" ]; then
                previous_evidence="$(jq -r '.executionContext.baseEvidenceHead // empty' "$plan_path")"
                previous_capacity="$(jq -r '.capacity // 0' "$plan_path")"
                if [ "$previous_evidence" = "$current_evidence" ] && [ "$previous_capacity" -ge 128 ]; then
                  failure_fingerprint="production-drain-failure"
                  breaker_key="$(printf '%s:%s:%s' "$current_source" "$current_evidence" "$failure_fingerprint" | sha256sum | cut -d' ' -f1)"
                  echo "Automatic production drain suppressed: unchanged failed source/Evidence tuple ($breaker_key)."
                  {
                    echo "### SigmaScope drain wake circuit open"
                    echo
                    echo "- Previous failed run: \`$latest_id\`"
                    echo "- SigmaScope source: \`$current_source\`"
                    echo "- Evidence authority: \`$current_evidence\`"
                    echo "- Failure fingerprint: \`$failure_fingerprint\`"
                    echo "- Breaker key: \`$breaker_key\`"
                    echo "- Automatic retry: suppressed until SigmaScope source or Evidence authority changes"
                    echo "- Manual direct drain dispatch: still available"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            else
              echo "::warning::Could not inspect the latest failed drain plan; circuit breaker is fail-open."
            fi
          fi

          gh workflow run sigmascope-parallel-drain.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref sigmascope \
            -f workers="$WORKERS" \
            -f items_per_worker="$ITEMS_PER_WORKER" \
            -f wave=1 \
            -f publish_client_every="$PUBLISH_CLIENT_EVERY"

          # Keep the wake mutex until GitHub exposes the dispatched drain. This closes
          # the small visibility race where a second wake could otherwise dispatch
          # another owner before the first run appears in the Actions run list.
          visible=false
          for attempt in 1 2 3 4 5; do
            sleep 2
            active_json="$(active_runs)"
            active_count="$(
              jq '[.[] | select(.status != "completed")] | length' <<<"$active_json"
            )"
            if [ "$active_count" -gt 0 ]; then
              visible=true
              break
            fi
          done
          if [ "$visible" != "true" ]; then
            echo "::error::Production drain dispatch was accepted but did not become visible."
            exit 3
          fi

          {
            echo "### SigmaScope drain wake dispatched"
            echo
            echo "- Workers: \`$WORKERS\`"
            echo "- Items per worker: \`$ITEMS_PER_WORKER\`"
            echo "- Active drain runs after dispatch: \`$active_count\`"
          } >> "$GITHUB_STEP_SUMMARY"
