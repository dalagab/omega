name: Omega catalog · freeze and publish

on:
  workflow_call:
    inputs:
      allow_source_removal:
        type: boolean
        required: false
        default: false
      authority_lock_held:
        description: Internal only; the caller already owns omega-catalog-sigmascope-exclusive
        type: boolean
        required: false
        default: false
      publish_client:
        description: Publish the Omega customer database after a changed authoritative freeze
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      allow_source_removal:
        description: "Allow an intentional removal from the previous canonical source registry"
        type: boolean
        required: false
        default: false
      publish_client:
        description: "Publish the Omega customer database after a changed authoritative freeze"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write
  packages: read

# Intentionally unscheduled. Authoritative freeze and customer publication are separate jobs so
# Phase 4 can defer the customer DB until its new Evidence child is verified.
jobs:
  freeze:
    uses: ./.github/workflows/catalog-builder.yml
    permissions:
      contents: write
      actions: write
      packages: read
    with:
      allow_source_removal: ${{ inputs.allow_source_removal || false }}
      authority_lock_held: ${{ inputs.authority_lock_held || false }}
    secrets: inherit

  publish-client:
    name: Publish Omega customer database from authoritative state
    needs: freeze
    if: needs.freeze.outputs.freeze_changed == 'true' && (inputs.publish_client || false)
    uses: ./.github/workflows/catalog-client-publish.yml
    permissions:
      contents: write
      packages: read
    with:
      authority_lock_held: ${{ inputs.authority_lock_held || false }}
    secrets: inherit
