schema: omega.sigmascope.ruleset.v1
rules:
  - schema: omega.sigmascope.rule.v1
    id: primitive.network.http
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [System.Net.Http.HttpClient, WebRequest, HttpWebRequest, DownloadString, DownloadData, DownloadFile]
    condition: marker
    emit:
      fact: network.http
      confidence: high
      title: Legacy HTTP/network static marker observed
      description: A retained static literal observation matches the reviewed legacy HTTP/network marker vocabulary.
      category: network

  - schema: omega.sigmascope.rule.v1
    id: primitive.network.socket
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [System.Net.Sockets, TcpClient, UdpClient, Socket.Connect, SocketAsyncEventArgs]
    condition: marker
    emit:
      fact: network.socket
      confidence: high
      title: Legacy socket static marker observed
      description: A retained static literal observation matches the reviewed legacy raw-socket marker vocabulary.
      category: network

  - schema: omega.sigmascope.rule.v1
    id: primitive.process.launch
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [System.Diagnostics.Process, Process.Start, ProcessStartInfo, CreateProcess, ShellExecute]
    condition: marker
    emit:
      fact: process.launch
      confidence: high
      title: Legacy process-launch static marker observed
      description: A retained static literal observation matches the reviewed legacy process-launch marker vocabulary.
      category: process

  - schema: omega.sigmascope.rule.v1
    id: primitive.shell.powershell
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [powershell.exe, pwsh.exe, cmd.exe, -EncodedCommand, System.Management.Automation]
    condition: marker
    emit:
      fact: shell.powershell
      confidence: high
      title: Legacy shell/PowerShell static marker observed
      description: A retained static literal observation matches the reviewed legacy command-shell or PowerShell marker vocabulary.
      category: process

  - schema: omega.sigmascope.rule.v1
    id: primitive.credential.api
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [CredentialManager, PasswordVault, Windows.Security.Credentials, ProtectedData.Unprotect, CryptUnprotectData, CredRead]
    condition: marker
    emit:
      fact: credential.api
      confidence: high
      title: Legacy credential/protected-data static marker observed
      description: A retained static literal observation matches the reviewed legacy credential/protected-data marker vocabulary.
      category: privacy
