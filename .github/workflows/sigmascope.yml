name: Omega Sigmascope

on:
  workflow_run:
    workflows:
      - "Omega SQLite catalog builder"
    types:
      - completed
  schedule:
    # Independent bounded Sigmascope revalidation between catalog-driven examinations.
    - cron: "47 3,15 * * *"
  workflow_dispatch:
    inputs:
      max_scans:
        description: "Maximum plugin variants for Sigmascope to examine in this run"
        type: string
        required: false
        default: "60"
      rescan_after_hours:
        description: "Re-check an unchanged artifact after this many hours"
        type: string
        required: false
        default: "168"
      max_batch_seconds:
        description: "Wall-clock budget for starting new Sigmascope examinations (0 disables)"
        type: string
        required: false
        default: "4200"
      internal_names:
        description: "Optional comma-separated InternalName allow-list for a bounded test run"
        type: string
        required: false
        default: ""

concurrency:
  group: omega-sigmascope
  cancel-in-progress: false

jobs:
  scan:
    name: Stage, audit and publish Sigmascope Security Evidence v2
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Checkout Omega source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout last-known-good Security Evidence v2 snapshot
        uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Self-test Sigmascope semantics and automation capability detection
        run: python tools/catalog/sigmascope.py --self-test
      - name: Run Sigmascope hardening and deterministic projection tests
        run: python tools/catalog/sigmascope.py --hardening-self-test
      - name: Self-test production Sigmascope Security Evidence v2 orchestration
        run: python tools/security/production_sigmascope_v2_pipeline.py --self-test
      - name: Resolve authoritative catalog handoff with early diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: >-
          python tools/security/sigmascope_handoff.py
          --event-name "$EVENT_NAME"
          --repository "$GH_REPO"
          --upstream-run-id "$UPSTREAM_RUN_ID"
          --output-dir catalog/security-input
          --previous-marketplace-dir catalog/previous-marketplace
          --current-evidence-dir catalog/security-v2-current
          --diagnostics catalog/sigmascope-handoff-diagnostics.json
      - name: Stage bounded Sigmascope v2 examination, refresh OSV/IPC/dependencies, and build marketplace candidate
        id: v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/security/production_sigmascope_v2_pipeline.py
          --base-database catalog/security-input/omega-catalog.sqlite
          --descriptor catalog/security-input/catalog.json
          --current-evidence catalog/security-v2-current
          --candidate-evidence catalog/security-v2-candidate
          --work-dir catalog/security-v2-work
          --publication-output catalog/publication-output
          --previous-marketplace-descriptor catalog/previous-marketplace/catalog.json
          --marketplace-download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
          --evidence-index-url "https://raw.githubusercontent.com/${{ github.repository }}/security-evidence-v2/index.json"
          --max-scans ${{ inputs.max_scans || '60' }}
          --max-batch-seconds ${{ inputs.max_batch_seconds || '4200' }}
          --rescan-after-hours ${{ inputs.rescan_after_hours || '168' }}
          --internal-names "${{ inputs.internal_names || '' }}"
          --source-overrides sources/source-overrides.json
          --github-output "$GITHUB_OUTPUT"
      - name: Validate small client marketplace candidate
        run: python tools/catalog/validate_marketplace_catalog.py --root catalog/publication-output
      - name: Reproduce security conclusions with independent developer audit
        shell: bash
        run: |
          set -euo pipefail
          audit=catalog/security-v2-work/security-developer-audit.json
          set +e
          python tools/security/developer_view.py audit \
            --no-download \
            --database catalog/security-v2-work/omega-security-v2-working.sqlite \
            --marketplace-database catalog/publication-output/omega-marketplace.sqlite \
            --json > "$audit"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ -s "$audit" ]; then
              python tools/security/print_sigmascope_audit_failures.py "$audit" --limit 20 || true
            fi
            exit "$status"
          fi
      - name: Project public-source coverage follow-ups
        run: >-
          python tools/catalog/sigmascope_source_followups.py
          --database catalog/security-v2-work/omega-security-v2-working.sqlite
          --output catalog/security-v2-work/sigmascope-source-followups.json
      - name: Reconcile actionable source follow-up issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/create_source_followup_issues.py
          --input catalog/security-v2-work/sigmascope-source-followups.json
          --repository ${{ github.repository }}
          --max-new 25
      - name: Publish validated Security Evidence v2 snapshot atomically
        if: steps.v2.outputs.publish_v2 == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          python tools/security/publish_security_evidence_v2.py \
            --input catalog/security-v2-candidate \
            --repo . \
            --branch security-evidence-v2 \
            --snapshot-validation-report catalog/security-v2-candidate/validation-report.json \
            --audit-report catalog/security-v2-work/security-developer-audit.json \
            --push
      - name: Publish small client marketplace only after all v2 gates pass
        if: steps.v2.outputs.publish_marketplace == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view catalog-latest --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create catalog-latest --repo "$GH_REPO" --title "Omega marketplace database" \
              --notes "Small Omega client marketplace catalog. Detailed Sigmascope evidence is stored on the security-evidence-v2 snapshot branch."
          fi
          assets=(
            catalog/publication-output/omega-marketplace.sqlite.zip
            catalog/publication-output/omega-marketplace.sqlite.zip.sha256
            catalog/publication-output/catalog.json
            catalog/publication-output/marketplace-projection-report.json
          )
          [ -f catalog/security-input/catalog-report.json ] && assets+=(catalog/security-input/catalog-report.json)
          gh release upload catalog-latest "${assets[@]}" --repo "$GH_REPO" --clobber
          # Legacy detailed evidence assets remain untouched as the archived v1 rollback reference.
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-v2-diagnostics
          path: |
            # The handoff file is created before catalog download attempts, so even an
            # early authoritative-catalog failure produces a downloadable diagnostic.
            catalog/sigmascope-handoff-diagnostics.json
            # Keep the production batch summary explicit: C# release contracts
            # require this audit artifact not to depend on a broad diagnostics glob.
            catalog/security-v2-work/production-sigmascope-v2-report.json
            catalog/security-v2-work/*.json
            catalog/security-v2-candidate/index.json
            catalog/security-v2-candidate/validation-report.json
            catalog/publication-output/catalog.json
            catalog/publication-output/marketplace-projection-report.json
          if-no-files-found: warn
          retention-days: 30
