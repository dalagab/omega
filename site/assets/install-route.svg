<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Omega installation route</title><desc id="d">Three steps: register repository, install through Dalamud, then open Omega in game.</desc><rect width="900" height="440" rx="28" fill="#090e19"/><path d="M190 220H710" stroke="#8faeff" stroke-opacity=".30" stroke-width="3" stroke-dasharray="7 11"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g transform="translate(190 220)"><circle r="68" fill="#121b2e" stroke="#8faeff" stroke-opacity=".55"/><text y="-4" fill="#f7f8fc" font-size="28" font-weight="800">1</text><text y="118" fill="#f7f8fc" font-size="17" font-weight="700">Add source</text><text y="143" fill="#95a3bb" font-size="13">script or manual</text></g><g transform="translate(450 220)"><circle r="68" fill="#121b2e" stroke="#79e2cf" stroke-opacity=".65"/><text y="-4" fill="#f7f8fc" font-size="28" font-weight="800">2</text><text y="118" fill="#f7f8fc" font-size="17" font-weight="700">Install in Dalamud</text><text y="143" fill="#95a3bb" font-size="13">/xlplugins</text></g><g transform="translate(710 220)"><circle r="68" fill="#121b2e" stroke="#eacb86" stroke-opacity=".65"/><text y="-4" fill="#f7f8fc" font-size="28" font-weight="800">3</text><text y="118" fill="#f7f8fc" font-size="17" font-weight="700">Open Omega</text><text y="143" fill="#95a3bb" font-size="13">/omega</text></g></g></svg>