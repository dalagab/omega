name: Omega plugin security scanner

on:
  workflow_run:
    workflows:
      - "Omega SQLite catalog builder"
    types:
      - completed
  schedule:
    # Independent bounded revalidation between catalog-driven scans.
    - cron: "47 3,15 * * *"
  workflow_dispatch:
    inputs:
      max_scans:
        description: "Maximum plugin variants to scan in this run"
        type: string
        required: false
        default: "60"
      rescan_after_hours:
        description: "Re-check an unchanged artifact after this many hours"
        type: string
        required: false
        default: "168"
      max_batch_seconds:
        description: "Wall-clock budget for starting new plugin scans (0 disables)"
        type: string
        required: false
        default: "4200"
      internal_names:
        description: "Optional comma-separated InternalName allow-list for a bounded test run"
        type: string
        required: false
        default: ""

concurrency:
  group: omega-security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Stage, audit and publish Security Evidence v2
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Checkout Omega source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout last-known-good Security Evidence v2 snapshot
        uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Self-test scanner semantics and automation capability detection
        run: python tools/catalog/security_scan.py --self-test
      - name: Run scanner hardening and deterministic projection tests
        run: python tools/catalog/security_scan.py --hardening-self-test
      - name: Self-test production Security Evidence v2 orchestration
        run: python tools/security/production_security_v2_pipeline.py --self-test
      - name: Download current catalog identities and previous client descriptor
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p catalog/security-input catalog/previous-marketplace
          gh release download catalog-latest --repo "$GH_REPO" --pattern catalog.json --dir catalog/previous-marketplace || true
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run download "$UPSTREAM_RUN_ID" --repo "$GH_REPO" --name omega-sqlite-catalog --dir catalog/security-input
          else
            gh release download catalog-latest --repo "$GH_REPO" \
              --pattern omega-marketplace.sqlite.zip --pattern catalog.json --dir catalog/security-input
            python -m zipfile -e catalog/security-input/omega-marketplace.sqlite.zip catalog/security-input
            test -f catalog/security-input/omega-marketplace.sqlite
            cp catalog/security-input/omega-marketplace.sqlite catalog/security-input/omega-catalog.sqlite
          fi
          test -f catalog/security-input/omega-catalog.sqlite
          test -f catalog/security-input/catalog.json
          test -f catalog/security-v2-current/index.json
          test -f catalog/security-v2-current/validation-report.json
      - name: Stage bounded v2 scan, refresh OSV/IPC/dependencies, and build marketplace candidate
        id: v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/security/production_security_v2_pipeline.py
          --base-database catalog/security-input/omega-catalog.sqlite
          --descriptor catalog/security-input/catalog.json
          --current-evidence catalog/security-v2-current
          --candidate-evidence catalog/security-v2-candidate
          --work-dir catalog/security-v2-work
          --publication-output catalog/publication-output
          --previous-marketplace-descriptor catalog/previous-marketplace/catalog.json
          --marketplace-download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
          --evidence-index-url "https://raw.githubusercontent.com/${{ github.repository }}/security-evidence-v2/index.json"
          --max-scans ${{ inputs.max_scans || '60' }}
          --max-batch-seconds ${{ inputs.max_batch_seconds || '4200' }}
          --rescan-after-hours ${{ inputs.rescan_after_hours || '168' }}
          --internal-names "${{ inputs.internal_names || '' }}"
          --source-overrides sources/source-overrides.json
          --github-output "$GITHUB_OUTPUT"
      - name: Validate small client marketplace candidate
        run: python tools/catalog/validate_marketplace_catalog.py --root catalog/publication-output
      - name: Reproduce security conclusions with independent developer audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/developer_view.py audit \
            --no-download \
            --database catalog/security-v2-work/omega-security-v2-working.sqlite \
            --marketplace-database catalog/publication-output/omega-marketplace.sqlite \
            --json > catalog/security-v2-work/security-developer-audit.json
      - name: Project public-source coverage follow-ups
        run: >-
          python tools/catalog/source_scan_followups.py
          --database catalog/security-v2-work/omega-security-v2-working.sqlite
          --output catalog/security-v2-work/source-scan-followups.json
      - name: Reconcile actionable source follow-up issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/create_source_followup_issues.py
          --input catalog/security-v2-work/source-scan-followups.json
          --repository ${{ github.repository }}
          --max-new 25
      - name: Publish validated Security Evidence v2 snapshot atomically
        if: steps.v2.outputs.publish_v2 == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          python tools/security/publish_security_evidence_v2.py \
            --input catalog/security-v2-candidate \
            --repo . \
            --branch security-evidence-v2 \
            --snapshot-validation-report catalog/security-v2-candidate/validation-report.json \
            --audit-report catalog/security-v2-work/security-developer-audit.json \
            --push
      - name: Publish small client marketplace only after all v2 gates pass
        if: steps.v2.outputs.publish_marketplace == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view catalog-latest --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create catalog-latest --repo "$GH_REPO" --title "Omega marketplace database" \
              --notes "Small Omega client marketplace catalog. Detailed security evidence is stored on the security-evidence-v2 snapshot branch."
          fi
          assets=(
            catalog/publication-output/omega-marketplace.sqlite.zip
            catalog/publication-output/omega-marketplace.sqlite.zip.sha256
            catalog/publication-output/catalog.json
            catalog/publication-output/marketplace-projection-report.json
          )
          [ -f catalog/security-input/catalog-report.json ] && assets+=(catalog/security-input/catalog-report.json)
          gh release upload catalog-latest "${assets[@]}" --repo "$GH_REPO" --clobber
          # Legacy detailed evidence assets remain untouched as the archived v1 rollback reference.
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omega-security-v2-diagnostics
          path: |
            # Keep the production batch summary explicit: C# release contracts
            # require this audit artifact not to depend on a broad diagnostics glob.
            catalog/security-v2-work/production-security-v2-report.json
            catalog/security-v2-work/*.json
            catalog/security-v2-candidate/index.json
            catalog/security-v2-candidate/validation-report.json
            catalog/publication-output/catalog.json
            catalog/publication-output/marketplace-projection-report.json
          if-no-files-found: warn
          retention-days: 30
