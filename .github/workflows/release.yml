name: Publish Omega release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.8.18"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: omega-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish Omega
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Release tag '$tag' must look like v0.8.18" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download current Dalamud dev runtime
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile 'dalamud.zip'
          Expand-Archive 'dalamud.zip' -DestinationPath $dalamudHome -Force
          Remove-Item 'dalamud.zip'

      - name: Verify repository version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'Omega/DalagabOmega.csproj'
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $manifest = Get-Content 'repository/pluginmaster.json' -Raw | ConvertFrom-Json
          $manifestVersion = [string]$manifest[0].AssemblyVersion
          $tagVersion = '${{ steps.release.outputs.version }}'
          if ($projectVersion -ne $tagVersion) { throw "Project version $projectVersion does not match tag $tagVersion" }
          if ($manifestVersion -ne $tagVersion) { throw "PluginMaster version $manifestVersion does not match tag $tagVersion" }

      - name: Build and run regression suite
        run: dotnet build .\Omega.sln -c Release

      - name: Stage Dalamud package
        id: package
        shell: pwsh
        run: |
          $candidate = Get-ChildItem -Path 'Omega/bin' -Filter 'latest.zip' -Recurse -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'Dalamud.NET.Sdk did not produce latest.zip under Omega/bin.' }
          Copy-Item $candidate.FullName 'Omega.zip' -Force
          $extract = Join-Path $env:RUNNER_TEMP 'omega-package-check'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive 'Omega.zip' -DestinationPath $extract -Force
          foreach ($required in @('DalagabOmega.dll','DalagabOmega.json','omega-catalog.sqlite.zip')) {
            if (-not (Get-ChildItem $extract -Filter $required -Recurse -File)) { throw "Omega.zip is missing $required" }
          }
          $hash = (Get-FileHash 'Omega.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Omega.zip" | Set-Content 'Omega.zip.sha256' -Encoding ascii
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Attest Omega.zip build provenance
        uses: actions/attest@v4
        with:
          subject-path: Omega.zip

      - name: Publish immutable versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          if (gh release view $tag *> $null) {
            gh release upload $tag Omega.zip Omega.zip.sha256 --clobber
          } else {
            gh release create $tag Omega.zip Omega.zip.sha256 --verify-tag --generate-notes --title "Omega ${{ steps.release.outputs.version }}"
          }

      - name: Publish stable Dalamud release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (gh release view omega-latest *> $null)) {
            gh release create omega-latest --target '${{ github.sha }}' --title 'Omega latest stable' --notes 'Stable Dalamud distribution endpoint. Assets are replaced by the release workflow.'
          }
          gh release upload omega-latest Omega.zip Omega.zip.sha256 --clobber
          gh release edit omega-latest --title 'Omega latest stable (${{ steps.release.outputs.version }})'
