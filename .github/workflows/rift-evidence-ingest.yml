name: Omega Rift Evidence v2 ingestion

on:
  workflow_call:
    inputs:
      rift_run_id:
        type: string
        required: true
      artifact_name:
        type: string
        required: false
        default: rift-runtime-results
      variant_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      rift_run_id:
        description: GitHub Actions run ID that produced the broker-bound Rift result artifact
        type: string
        required: true
      artifact_name:
        description: Rift result artifact name
        type: string
        required: true
        default: rift-runtime-results
      variant_id:
        description: Canonical current Evidence-v2 variant ID
        type: string
        required: true

concurrency:
  group: omega-catalog-sigmascope-exclusive
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SigmaScope integration tooling
        uses: actions/checkout@v6
        with:
          ref: sigmascope
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Checkout current Security Evidence v2
        uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false
      - name: Download broker-bound Rift result artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RIFT_RUN_ID: ${{ inputs.rift_run_id }}
          RIFT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/rift-result
          gh run download "$RIFT_RUN_ID" --repo "${{ github.repository }}" --name "$RIFT_ARTIFACT_NAME" --dir catalog/rift-result
      - name: Resolve exact Rift evidence files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          one() {
            local name="$1"
            mapfile -t found < <(find catalog/rift-result -type f -name "$name" -print)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "Expected exactly one $name, found ${#found[@]}" >&2
              exit 1
            fi
            printf '%s' "${found[0]}"
          }
          request="$(one rift-request.json)"
          runtime="$(one runtime-report.json)"
          attestation="$(one supervisor-attestation.json)"
          component=""
          mapfile -t components < <(find catalog/rift-result -type f -name component-security.json -print)
          if [ "${#components[@]}" -gt 1 ]; then echo "Multiple component-security.json files found" >&2; exit 1; fi
          if [ "${#components[@]}" -eq 1 ]; then component="${components[0]}"; fi
          printf 'request=%s\n' "$request" >> "$GITHUB_OUTPUT"
          printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"
          printf 'attestation=%s\n' "$attestation" >> "$GITHUB_OUTPUT"
          printf 'component=%s\n' "$component" >> "$GITHUB_OUTPUT"
      - name: Import trusted Rift observations into a candidate Evidence-v2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --current-evidence catalog/security-v2-current
            --candidate-evidence catalog/security-v2-candidate
            --request '${{ steps.files.outputs.request }}'
            --runtime-report '${{ steps.files.outputs.runtime }}'
            --attestation '${{ steps.files.outputs.attestation }}'
            --output catalog/rift-ingestion.json
          )
          if [ -n '${{ steps.files.outputs.component }}' ]; then args+=(--component-security-report '${{ steps.files.outputs.component }}'); fi
          python tools/security/rift_evidence_adapter.py "${args[@]}"
      - name: Build intrinsic snapshot validation report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools/security:tools/catalog python - <<'PY'
          import json
          from pathlib import Path
          from security_evidence_v2 import validate_snapshot
          root=Path('catalog/security-v2-candidate')
          report=validate_snapshot(root)
          Path('catalog/rift-snapshot-validation.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          if not report.get('ok'):
              raise SystemExit('\n'.join(report.get('errors') or ['snapshot validation failed']))
          PY
      - name: Independently audit Rift identity, attestation and collector projection
        run: >-
          python tools/security/rift_evidence_audit.py
          --evidence catalog/security-v2-candidate
          --variant-id '${{ inputs.variant_id }}'
          --output catalog/rift-ingestion-audit.json
      - name: Publish validated Security Evidence v2 snapshot atomically
        run: >-
          python tools/security/publish_security_evidence_v2.py
          --input catalog/security-v2-candidate
          --repo .
          --branch security-evidence-v2
          --snapshot-validation-report catalog/rift-snapshot-validation.json
          --audit-report catalog/rift-ingestion-audit.json
          --message "Security evidence v2 Rift runtime ingestion ${{ inputs.rift_run_id }}"
          --push
      - name: Upload Rift ingestion diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omega-rift-evidence-ingestion-${{ inputs.rift_run_id }}
          path: |
            catalog/rift-ingestion.json
            catalog/rift-snapshot-validation.json
            catalog/rift-ingestion-audit.json
          if-no-files-found: warn
          retention-days: 30
