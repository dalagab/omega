name: Rift hostile-code boundary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'InterdimensionalRift/**'
      - 'InterdimensionalRift.DalamudShim/**'
      - 'samples/**'
      - 'tests/InterdimensionalRift.Tests/**'
      - 'tools/**'
      - '.github/workflows/rift-bubblewrap-boundary.yml'
      - 'docs/INTERDIMENSIONAL-RIFT-HARDENING.adoc'
  push:
    paths:
      - 'InterdimensionalRift/**'
      - 'InterdimensionalRift.DalamudShim/**'
      - 'samples/**'
      - 'tests/InterdimensionalRift.Tests/**'
      - 'tools/**'
      - '.github/workflows/rift-bubblewrap-boundary.yml'
      - 'docs/INTERDIMENSIONAL-RIFT-HARDENING.adoc'

permissions:
  contents: read

jobs:
  boundary:
    # Deliberately a GitHub-hosted VM, not ubuntu-slim and not a job container.
    runs-on: ubuntu-24.04
    timeout-minutes: 7

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install boundary dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap libcap2-bin libseccomp-dev gcc pkg-config

      - name: Enable user namespaces on disposable runner
        run: sudo ./tools/enable-userns-github.sh

      - name: Verify Bubblewrap namespace boundary
        run: ./tools/verify-bwrap.sh

      - name: Verify cgroup-v2 transient scope
        run: ./tools/verify-rift-cgroup.sh

      - name: Build versioned seccomp policy
        run: |
          policy=$(./tools/build-rift-seccomp.sh "$RUNNER_TEMP/rift-seccomp.bpf")
          test -s "$policy"
          sha256sum "$policy"

      - name: Verify API-15 source contract gates
        run: python3 ./tools/check-rift-source-contract.py

      - name: Validate shell supervisors
        run: |
          for script in tools/*.sh; do
            bash -n "$script"
          done
