<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Omega constellation illustration</title>
<desc id="desc">A stylized orbital map representing Dalamud, Omega and the wider plugin ecosystem.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#56172e" stop-opacity=".48"/><stop offset="1" stop-color="#08070b" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="700" fill="url(#bg)"/>
<g fill="none" stroke="#ef5c72" stroke-opacity=".22">
  <ellipse cx="450" cy="350" rx="330" ry="205" transform="rotate(-14 450 350)"/>
  <ellipse cx="450" cy="350" rx="255" ry="310" transform="rotate(38 450 350)"/>
  <ellipse cx="450" cy="350" rx="390" ry="120" transform="rotate(24 450 350)"/>
</g>
<g stroke="#36d7d0" stroke-opacity=".31" stroke-width="1.4">
  <path d="M110 426 L238 250 L366 315 L512 167 L665 292 L790 215" fill="none"/>
  <path d="M180 145 L318 210 L430 116 L592 222 L734 493" fill="none"/>
  <path d="M137 533 L300 475 L458 545 L612 432 L784 545" fill="none"/>
</g>
<g fill="#f1d9de">
  <circle cx="110" cy="426" r="4"/><circle cx="238" cy="250" r="5"/><circle cx="366" cy="315" r="3"/><circle cx="512" cy="167" r="4"/><circle cx="665" cy="292" r="4"/><circle cx="790" cy="215" r="3"/>
  <circle cx="180" cy="145" r="3"/><circle cx="318" cy="210" r="4"/><circle cx="430" cy="116" r="3"/><circle cx="592" cy="222" r="3"/><circle cx="734" cy="493" r="4"/>
  <circle cx="137" cy="533" r="3"/><circle cx="300" cy="475" r="4"/><circle cx="458" cy="545" r="3"/><circle cx="612" cy="432" r="4"/><circle cx="784" cy="545" r="3"/>
</g>
<g filter="url(#glow)"><circle cx="450" cy="350" r="80" fill="#ae2445" fill-opacity=".14" stroke="#ef5c72" stroke-opacity=".7"/><circle cx="450" cy="350" r="16" fill="#ff9bad"/></g>
<g transform="translate(635 355)" filter="url(#glow)"><circle r="40" fill="#36d7d0" fill-opacity=".09" stroke="#36d7d0" stroke-opacity=".76"/><path d="M-18 0h36M0-18v36M-12-12l24 24M12-12l-24 24" stroke="#36d7d0" stroke-width="2"/></g>
<text x="450" y="455" text-anchor="middle" fill="#f1d9de" font-family="system-ui,sans-serif" font-size="16" letter-spacing="4">DALAMUD</text>
<text x="635" y="422" text-anchor="middle" fill="#68eee8" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">OMEGA</text>
</svg>
