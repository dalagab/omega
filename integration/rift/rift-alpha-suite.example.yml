name: Omega Alpha calibration suite
on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Registered alpha.* test id
        required: true
        type: string
      engine:
        description: all, sigmascope, or rift
        required: false
        default: all
        type: string

# One workflow for the corpus. The concrete production file should resolve the
# registry, build the selected project, then fan out to the reusable SigmaScope
# Alpha adapter and/or Rift according to the registry's `engines` field.
