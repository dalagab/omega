name: Omega security services · Sigmascope launcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      internal_names:
        description: "Optional comma-separated InternalName allow-list for a bounded developer run"
        type: string
        required: false
        default: ""
      workers:
        description: "Production parallel drain workers when internal_names is empty (1-8)"
        type: number
        required: false
        default: 8
      items_per_worker:
        description: "Exact queue items per production worker (1-16; total max 64)"
        type: number
        required: false
        default: 8

permissions:
  contents: write
  issues: write
  actions: write
  packages: read

jobs:
  production-drain-wake:
    if: ${{ (inputs.internal_names || '') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch coalesced production drain wake on SigmaScope
        env:
          GH_TOKEN: ${{ github.token }}
          WORKERS: ${{ inputs.workers || 8 }}
          ITEMS_PER_WORKER: ${{ inputs.items_per_worker || 8 }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sigmascope-drain-wake.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref sigmascope \
            -f workers="$WORKERS" \
            -f items_per_worker="$ITEMS_PER_WORKER" \
            -f publish_client_every=5

  bounded-developer-run:
    if: ${{ (inputs.internal_names || '') != '' }}
    uses: dalagab/omega/.github/workflows/sigmascope.yml@sigmascope
    with:
      internal_names: ${{ inputs.internal_names }}
    secrets: inherit
