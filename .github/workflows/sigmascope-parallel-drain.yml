name: Omega SigmaScope · production parallel queue drain

on:
  workflow_call:
    inputs:
      workers:
        description: Parallel scanner workers for each production wave
        type: number
        required: false
        default: 4
      items_per_worker:
        description: Exact persistent queue keys processed sequentially by each worker
        type: number
        required: false
        default: 10
      wave:
        description: Drain-wave ordinal used for progress and customer publication cadence
        type: number
        required: false
        default: 1
      publish_client_every:
        description: Republish Omega customer DB every N successful parallel waves
        type: number
        required: false
        default: 5
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel scanner workers for each production wave (1-8)
        type: number
        required: false
        default: 4
      items_per_worker:
        description: Exact queue keys per worker for each wave (1-16; total max 64)
        type: number
        required: false
        default: 10
      wave:
        description: Initial wave ordinal
        type: number
        required: false
        default: 1
      publish_client_every:
        description: Republish Omega customer DB every N waves
        type: number
        required: false
        default: 5

permissions:
  contents: write
  actions: write
  issues: write
  packages: read

concurrency:
  # Keep duplicate drain chains serialized, but do not hold the catalog/Evidence
  # authority mutex while workers perform read-only analysis.
  group: omega-sigmascope-parallel-drain-exclusive
  cancel-in-progress: false
  queue: max

env:
  PYTHONUNBUFFERED: "1"

jobs:
  resolve-images:
    name: Resolve immutable production worker images
    runs-on: ubuntu-latest
    outputs:
      scan_image: ${{ steps.images.outputs.scan_image }}
      publisher_image: ${{ steps.images.outputs.publisher_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-worker-images
          path: image-state
          persist-credentials: false
      - id: images
        shell: bash
        run: |
          set -euo pipefail
          scan_ref="$(jq -er --arg image "sigmascope-worker" '.images[$image] // empty' image-state/index.json)"
          publisher_ref="$(jq -er --arg image "publisher-worker" '.images[$image] // empty' image-state/index.json)"
          for ref in "$scan_ref" "$publisher_ref"; do
            [[ "$ref" =~ ^ghcr\.io/[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid or missing digest-pinned production image: $ref"
              exit 3
            }
          done
          echo "scan_image=$scan_ref" >> "$GITHUB_OUTPUT"
          echo "publisher_image=$publisher_ref" >> "$GITHUB_OUTPUT"

  plan:
    name: Select disjoint release-update and baseline worker lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      assignment_count: ${{ steps.plan.outputs.assignment_count }}
      base_head: ${{ steps.plan.outputs.base_head }}
      catalog_head: ${{ steps.plan.outputs.catalog_head }}
      dev_sha: ${{ steps.plan.outputs.dev_sha }}
      serial_fallback: ${{ steps.plan.outputs.serial_fallback }}
      blocked_reason: ${{ steps.plan.outputs.blocked_reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigmascope
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: catalog-data
          path: catalog/active-state
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout RoboScope Git operations when available
        continue-on-error: true
        uses: actions/checkout@v6
        with: {ref: security-operations, path: catalog/roboscope-operations, fetch-depth: 1, persist-credentials: false}
      - name: Build run-local RoboScope scan-demand overlay
        shell: bash
        run: |
          set -euo pipefail
          python tools/operations/roboscope_git_operations.py build-scan-overlay \
            --queue-seed catalog/active-state/scan-queue.json \
            --catalog-root catalog/active-state/catalog \
            --evidence-root catalog/security-v2-current \
            --operations-root catalog/roboscope-operations \
            --output catalog/roboscope-effective-scan-queue.json \
            --report catalog/roboscope-operations-report.json
      - id: plan
        env:
          WORKERS: ${{ inputs.workers || 4 }}
          ITEMS_PER_WORKER: ${{ inputs.items_per_worker || 10 }}
          WAVE: ${{ inputs.wave || 1 }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/sigmascope_parallel_drain_plan.py \
            --queue-seed catalog/roboscope-effective-scan-queue.json \
            --evidence-root catalog/security-v2-current \
            --workers "$WORKERS" \
            --items-per-worker "$ITEMS_PER_WORKER" \
            --wave "$WAVE" \
            --output catalog/sigmascope-drain-plan.json
          echo "matrix=$(jq -c '.matrix' catalog/sigmascope-drain-plan.json)" >> "$GITHUB_OUTPUT"
          echo "assignment_count=$(jq -r '.assignmentCount' catalog/sigmascope-drain-plan.json)" >> "$GITHUB_OUTPUT"
          echo "serial_fallback=$(jq -r '.serialFallbackRequired' catalog/sigmascope-drain-plan.json)" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=$(jq -r '.blockedReason' catalog/sigmascope-drain-plan.json)" >> "$GITHUB_OUTPUT"
          echo "base_head=$(git -C catalog/security-v2-current rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "catalog_head=$(git -C catalog/active-state rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summarize production wave
        shell: bash
        run: |
          {
            echo "### SigmaScope production drain wave ${{ inputs.wave || 1 }}"
            echo
            echo "- Assignments: \`$(jq -r '.assignmentCount' catalog/sigmascope-drain-plan.json)\`"
            echo "- Active workers: \`$(jq -r '.activeWorkerCount' catalog/sigmascope-drain-plan.json)\`"
            echo "- Capacity: \`$(jq -r '.capacity' catalog/sigmascope-drain-plan.json)\`"
            echo "- Capacity used: \`$(jq -r 'if .capacity > 0 then (((.assignmentCount * 10000 / .capacity) | floor) / 100) else 0 end' catalog/sigmascope-drain-plan.json)%\`"
            echo "- Assignments by lane: \`$(jq -c '[.assignments[].workerLane] | group_by(.) | map({(.[0]): length}) | add // {}' catalog/sigmascope-drain-plan.json)\`"
            echo "- Eligible queue items now: \`$(jq -r '.queueSummaryBefore.eligibleNow' catalog/sigmascope-drain-plan.json)\`"
            echo "- Deferred by retry backoff: \`$(jq -r '.queueSummaryBefore.retryDeferred' catalog/sigmascope-drain-plan.json)\`"
            echo "- Oldest eligible enqueue: \`$(jq -r '.queueSummaryBefore.oldestEligibleEnqueuedAtUtc // "" | if . == "" then "none" else . end' catalog/sigmascope-drain-plan.json)\`"
            echo "- Highest pending attempt count: \`$(jq -r '.queueSummaryBefore.maxPendingAttemptCount' catalog/sigmascope-drain-plan.json)\`"
            echo "- More parallel work after this wave: \`$(jq -r '.moreParallelEligible' catalog/sigmascope-drain-plan.json)\`"
            echo "- Baseline rebuild: \`$(jq -r '.baselineSecurityRebuild' catalog/sigmascope-drain-plan.json)\`"
            echo "- Selection policy: \`$(jq -r '.selectionPolicy' catalog/sigmascope-drain-plan.json)\`"
            echo "- Blocked reason: \`$(jq -r '.blockedReason' catalog/sigmascope-drain-plan.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-drain-plan
          path: |
            catalog/sigmascope-drain-plan.json
            catalog/roboscope-effective-scan-queue.json
            catalog/roboscope-operations-report.json
          if-no-files-found: error
          retention-days: 7

  workers:
    name: Scan ${{ matrix.lane }} slot ${{ matrix.slot }} (${{ matrix.assignmentCount }} exact queue keys)
    needs: [resolve-images, plan]
    if: needs.plan.outputs.assignment_count != '0'
    runs-on: [self-hosted, Linux, X64, omega-security]
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    env:
      OMEGA_FROZEN_WORKER: catalog/active-state/definitions/worker
      OMEGA_SECONDARY_SECURITY_CACHE: catalog/secondary-security-runtime
      QUEUE_KEYS_JSON: ${{ toJSON(matrix.queueKeys) }}
      BASE_EVIDENCE_HEAD: ${{ needs.plan.outputs.base_head }}
      WORKER_IMAGE: ${{ needs.resolve-images.outputs.scan_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.dev_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.catalog_head }}
          path: catalog/active-state
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-drain-plan
          path: catalog/roboscope-plan
      - name: Pull pinned worker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$WORKER_IMAGE"
      - name: Bind worker to exact planned Evidence and frozen worker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --userns=keep-id -v "$PWD:$PWD:Z" -w "$PWD" \
            -e BASE_EVIDENCE_HEAD -e OMEGA_FROZEN_WORKER \
            "$WORKER_IMAGE" bash tools/security/sigmascope_parallel_worker_entrypoint.sh bind

      - name: Materialize frozen secondary-security assets when available
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --userns=keep-id -v "$PWD:$PWD:Z" -w "$PWD" \
            -e OMEGA_FROZEN_WORKER -e OMEGA_SECONDARY_SECURITY_CACHE \
            "$WORKER_IMAGE" bash tools/security/sigmascope_parallel_worker_entrypoint.sh materialize-assets

      - name: Materialize frozen canonical catalog once for this worker slot
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --userns=keep-id -v "$PWD:$PWD:Z" -w "$PWD" \
            -e OMEGA_FROZEN_WORKER \
            "$WORKER_IMAGE" bash tools/security/sigmascope_parallel_worker_entrypoint.sh materialize-catalog

      - name: Process exact queue keys in one frozen Evidence hydration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --userns=keep-id -v "$PWD:$PWD:Z" -w "$PWD" \
            -e GITHUB_REPOSITORY -e OMEGA_FROZEN_WORKER -e QUEUE_KEYS_JSON -e WORKER_IMAGE \
            "$WORKER_IMAGE" bash tools/security/sigmascope_parallel_worker_entrypoint.sh process

      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-drain-${{ github.run_id }}-slot-${{ matrix.slot }}
          path: catalog/slot-result-bundles
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge and validate one production Evidence candidate
    needs: [resolve-images, plan, workers]
    if: needs.plan.outputs.assignment_count != '0' && needs.workers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      image: ${{ needs.resolve-images.outputs.scan_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      next_mode: ${{ steps.next.outputs.next_mode }}
      publish_client: ${{ steps.next.outputs.publish_client }}
      successful: ${{ steps.next.outputs.successful }}
      failed: ${{ steps.next.outputs.failed }}
    env:
      OMEGA_FROZEN_WORKER: catalog/active-state/definitions/worker
      OMEGA_SECONDARY_SECURITY_CACHE: catalog/secondary-security-runtime
      BASE_EVIDENCE_HEAD: ${{ needs.plan.outputs.base_head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.dev_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.catalog_head }}
          path: catalog/active-state
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: omega-sigmascope-drain-${{ github.run_id }}-slot-*
          path: catalog/drain-worker-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-drain-plan
          path: catalog/roboscope-plan
      - name: Re-check exact Evidence base and result-bundle cardinality
        shell: bash
        run: |
          set -euo pipefail
          current="$(git -C catalog/security-v2-current rev-parse HEAD)"
          test "$current" = "$BASE_EVIDENCE_HEAD" || {
            echo "::error::Evidence moved before merge: planned=$BASE_EVIDENCE_HEAD current=$current"
            exit 3
          }
          mapfile -t bundles < <(find catalog/drain-worker-artifacts -name bundle.json -printf '%h\n' | sort)
          expected="${{ needs.plan.outputs.assignment_count }}"
          test "${#bundles[@]}" -eq "$expected" || {
            echo "::error::Expected $expected result bundles, found ${#bundles[@]}"
            exit 4
          }

      - name: Checkout previous Deep Scan state when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/deep-scan-current
          if git ls-remote --exit-code --heads origin deep-scan-state >/dev/null 2>&1; then
            git fetch --depth=1 origin deep-scan-state
            git archive FETCH_HEAD | tar -x -C catalog/deep-scan-current
          fi

      - name: Materialize frozen canonical catalog and secondary-security assets
        shell: bash
        run: |
          set -euo pipefail
          definitions_revision="$(jq -r '.definitionsRevision' catalog/active-state/definitions/index.json)"
          python tools/catalog/catalog_json_store.py materialize \
            --root catalog/active-state/catalog \
            --database catalog/security-input/omega-catalog.sqlite \
            --definitions-revision "$definitions_revision"
          python "$OMEGA_FROZEN_WORKER/tools/catalog/secondary_security_assets.py" materialize-clamav \
            --definitions-root catalog/active-state/definitions \
            --output "$OMEGA_SECONDARY_SECURITY_CACHE" || true

      - name: Merge all disjoint exact-key result bundles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find catalog/drain-worker-artifacts -name bundle.json -printf '%h\n' | sort)
          python tools/security/sigmascope_result_merger.py \
            --current-evidence catalog/security-v2-current \
            --base-database catalog/security-input/omega-catalog.sqlite \
            --definitions-root catalog/active-state/definitions \
            --queue-seed catalog/roboscope-plan/roboscope-effective-scan-queue.json \
            --candidate-evidence catalog/security-v2-drain-candidate \
            --work-dir catalog/security-v2-drain-work \
            --report catalog/sigmascope-drain-merge-report.json \
            --previous-deep-scan-state catalog/deep-scan-current/index.json \
            --deep-scan-output catalog/security-v2-drain-work/deep-scan-state \
            --source-followup-output catalog/security-v2-drain-work/sigmascope-source-followups.json \
            "${bundles[@]}"

      - name: Apply independent Evidence audit and storage gates
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/security_developer_audit.py \
            --database catalog/security-v2-drain-work/omega-security-parallel-merge.sqlite \
            --advisories catalog/active-state/definitions/osv-advisories.json \
            --json > catalog/sigmascope-drain-developer-audit.json
          python tools/security/evidence_storage_audit.py \
            --root catalog/security-v2-drain-candidate \
            --report catalog/sigmascope-drain-storage-audit.json

      - id: next
        name: Plan from merged candidate and decide whether to continue
        env:
          WORKERS: ${{ inputs.workers || 4 }}
          ITEMS_PER_WORKER: ${{ inputs.items_per_worker || 10 }}
          WAVE: ${{ inputs.wave || 1 }}
          PUBLISH_CLIENT_EVERY: ${{ inputs.publish_client_every || 5 }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/sigmascope_parallel_drain_plan.py \
            --queue-seed catalog/roboscope-plan/roboscope-effective-scan-queue.json \
            --evidence-root catalog/security-v2-drain-candidate \
            --workers "$WORKERS" \
            --items-per-worker "$ITEMS_PER_WORKER" \
            --output catalog/sigmascope-drain-post-plan.json

          assignments="$(jq -r '.assignmentCount' catalog/sigmascope-drain-post-plan.json)"
          serial="$(jq -r '.serialFallbackRequired' catalog/sigmascope-drain-post-plan.json)"
          if [ "$assignments" -gt 0 ]; then
            next_mode=parallel
          elif [ "$serial" = "true" ]; then
            next_mode=serial
          else
            next_mode=done
          fi

          cadence="$PUBLISH_CLIENT_EVERY"
          if [ "$cadence" -lt 1 ]; then cadence=1; fi
          if [ "$next_mode" != "parallel" ] || [ $((WAVE % cadence)) -eq 0 ]; then
            publish_client=true
          else
            publish_client=false
          fi

          successful="$(jq -r '.successfulVariantIds | length' catalog/sigmascope-drain-merge-report.json)"
          selected="$(jq -r '.variantIds | length' catalog/sigmascope-drain-merge-report.json)"
          failed=$((selected - successful))
          echo "next_mode=$next_mode" >> "$GITHUB_OUTPUT"
          echo "publish_client=$publish_client" >> "$GITHUB_OUTPUT"
          echo "successful=$successful" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Package exact candidate and deferred side effects for one writer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf catalog/drain-publication
          mkdir -p catalog/drain-publication
          tar -czf catalog/drain-publication/candidate.tar.gz -C catalog/security-v2-drain-candidate .
          (cd catalog/drain-publication && sha256sum candidate.tar.gz > candidate.tar.gz.sha256)
          cp catalog/sigmascope-drain-merge-report.json catalog/drain-publication/merge-report.json
          cp catalog/sigmascope-drain-developer-audit.json catalog/drain-publication/developer-audit.json
          cp catalog/sigmascope-drain-storage-audit.json catalog/drain-publication/storage-audit.json
          cp catalog/sigmascope-drain-post-plan.json catalog/drain-publication/post-plan.json
          cp catalog/security-v2-drain-work/sigmascope-source-followups.json \
            catalog/drain-publication/source-followups.json
          if [ -d catalog/security-v2-drain-work/deep-scan-state ]; then
            cp -a catalog/security-v2-drain-work/deep-scan-state catalog/drain-publication/deep-scan-state
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: omega-sigmascope-drain-publication
          path: catalog/drain-publication
          if-no-files-found: error
          retention-days: 1

  publish:
    name: One-writer publish merged Evidence and deferred security state
    needs: [resolve-images, plan, merge]
    if: needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: omega-catalog-sigmascope-exclusive
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
      packages: read
    container:
      image: ${{ needs.resolve-images.outputs.publisher_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      next_mode: ${{ steps.authority.outputs.next_mode }}
      publish_client: ${{ steps.authority.outputs.publish_client }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.dev_sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.catalog_head }}
          path: catalog/active-state
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: security-evidence-v2
          path: catalog/security-v2-current
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: omega-sigmascope-drain-publication
          path: catalog/drain-publication

      - id: authority
        name: Revalidate planned authority heads after acquiring the writer lock
        env:
          EXPECTED_CATALOG_HEAD: ${{ needs.plan.outputs.catalog_head }}
          EXPECTED_EVIDENCE_HEAD: ${{ needs.plan.outputs.base_head }}
          PLANNED_NEXT_MODE: ${{ needs.merge.outputs.next_mode }}
          PLANNED_PUBLISH_CLIENT: ${{ needs.merge.outputs.publish_client }}
        shell: bash
        run: |
          set -euo pipefail
          current_catalog="$(git -C catalog/active-state ls-remote --heads origin refs/heads/catalog-data | awk '{print $1}')"
          current_evidence="$(git -C catalog/security-v2-current ls-remote --heads origin refs/heads/security-evidence-v2 | awk '{print $1}')"
          [[ "$current_catalog" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_evidence" =~ ^[0-9a-f]{40}$ ]]

          if [ "$current_catalog" != "$EXPECTED_CATALOG_HEAD" ] || [ "$current_evidence" != "$EXPECTED_EVIDENCE_HEAD" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "next_mode=parallel" >> "$GITHUB_OUTPUT"
            echo "publish_client=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Stale parallel candidate discarded"
              echo
              echo "The candidate was computed outside the authority lock and an authoritative parent advanced before publication."
              echo
              echo "- Completed exact results: \`${{ needs.merge.outputs.successful }}\`"
              echo "- Failed / retained for retry: \`${{ needs.merge.outputs.failed }}\`"
              echo "- Planned catalog: \`$EXPECTED_CATALOG_HEAD\`"
              echo "- Current catalog: \`$current_catalog\`"
              echo "- Planned Evidence: \`$EXPECTED_EVIDENCE_HEAD\`"
              echo "- Current Evidence: \`$current_evidence\`"
              echo
              echo "A fresh drain will use the newly authoritative inputs; no stale candidate was published."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "next_mode=$PLANNED_NEXT_MODE" >> "$GITHUB_OUTPUT"
            echo "publish_client=$PLANNED_PUBLISH_CLIENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Rehydrate exact candidate and re-check parent
        if: steps.authority.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd catalog/drain-publication && sha256sum -c candidate.tar.gz.sha256)
          mkdir -p catalog/drain-publication/candidate
          tar -xzf catalog/drain-publication/candidate.tar.gz -C catalog/drain-publication/candidate
          current="$(git -C catalog/security-v2-current rev-parse HEAD)"
          expected="${{ needs.plan.outputs.base_head }}"
          test "$current" = "$expected" || {
            echo "::error::Evidence moved before one-writer publication: expected=$expected current=$current"
            exit 3
          }

      - name: Publish exact validated Security Evidence v2 child
        if: steps.authority.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          python tools/security/publish_security_evidence_v2.py \
            --input catalog/drain-publication/candidate \
            --repo . \
            --branch security-evidence-v2 \
            --history-mode fast-forward \
            --expected-parent-sha "${{ needs.plan.outputs.base_head }}" \
            --snapshot-validation-report catalog/drain-publication/candidate/validation-report.json \
            --audit-report catalog/drain-publication/developer-audit.json \
            --message "SigmaScope production parallel drain wave ${{ inputs.wave || 1 }}" \
            --push

      - name: Publish Deep Scan state derived from newly-authoritative Evidence
        if: ${{ steps.authority.outputs.publish == 'true' && hashFiles('catalog/drain-publication/deep-scan-state/index.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/security/publish_deep_scan_state.py
          --input catalog/drain-publication/deep-scan-state
          --repo .
          --branch deep-scan-state
          --push

      - name: Reconcile source follow-up issues after Evidence publication
        if: ${{ steps.authority.outputs.publish == 'true' && hashFiles('catalog/drain-publication/source-followups.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python catalog/active-state/definitions/worker/tools/catalog/create_source_followup_issues.py
          --input catalog/drain-publication/source-followups.json
          --repository "${{ github.repository }}"
          --max-new 25
          --max-close 100

      - name: Publish wave summary
        if: steps.authority.outputs.publish == 'true'
        shell: bash
        run: |
          {
            echo "### SigmaScope production parallel wave published"
            echo
            echo "- Successful exact items: \`${{ needs.merge.outputs.successful }}\`"
            echo "- Failed / retained for retry: \`${{ needs.merge.outputs.failed }}\`"
            echo "- Next mode: \`${{ needs.merge.outputs.next_mode }}\`"
            echo "- Customer DB refresh this wave: \`${{ needs.merge.outputs.publish_client }}\`"
            echo "- Published parent: \`${{ needs.plan.outputs.base_head }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-client:
    name: Periodic customer DB projection
    needs: publish
    if: needs.publish.outputs.publish_client == 'true'
    uses: ./.github/workflows/catalog-client-publish.yml
    with:
      # The publish job releases its job-scoped authority lock before this
      # reusable workflow starts, so customer projection must reacquire it.
      authority_lock_held: false
    secrets: inherit

  continue:
    name: Continue until no immediately eligible primary work remains
    needs: [plan, publish, publish-client]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      (needs.publish-client.result == 'success' || needs.publish-client.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the next bounded authority owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_MODE: ${{ needs.publish.outputs.next_mode }}
          WORKERS: ${{ inputs.workers || 4 }}
          ITEMS_PER_WORKER: ${{ inputs.items_per_worker || 10 }}
          PUBLISH_CLIENT_EVERY: ${{ inputs.publish_client_every || 5 }}
          WAVE: ${{ inputs.wave || 1 }}
        shell: bash
        run: |
          set -euo pipefail
          other_active="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow sigmascope-parallel-drain.yml \
              --limit 100 \
              --json databaseId,status | \
            jq --arg current "$GITHUB_RUN_ID" '[.[] | select(((.databaseId | tostring) != $current) and (.status != "completed"))] | length'
          )"
          if [ "$other_active" -gt 0 ]; then
            echo "Another active parallel drain already owns successor dispatch; not queuing a duplicate chain."
            exit 0
          fi

          if [ "$NEXT_MODE" = "parallel" ]; then
            next_wave=$((WAVE + 1))
            gh workflow run sigmascope-parallel-drain.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref sigmascope \
              -f workers="$WORKERS" \
              -f items_per_worker="$ITEMS_PER_WORKER" \
              -f wave="$next_wave" \
              -f publish_client_every="$PUBLISH_CLIENT_EVERY"
            echo "Queued production parallel drain wave $next_wave."
          elif [ "$NEXT_MODE" = "serial" ]; then
            gh workflow run sigmascope.yml --repo "$GITHUB_REPOSITORY" --ref sigmascope
            echo "Queued bounded serialized worker for global/non-variant work."
          else
            echo "No immediately eligible SigmaScope work remains; drain is quiescent."
          fi

  idle-or-serial-fallback:
    name: Handle an empty parallel plan
    needs: plan
    if: needs.plan.outputs.assignment_count == '0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop cleanly or hand global work to the serialized worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERIAL_FALLBACK: ${{ needs.plan.outputs.serial_fallback }}
          BLOCKED_REASON: ${{ needs.plan.outputs.blocked_reason }}
        shell: bash
        run: |
          set -euo pipefail
          other_active="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow sigmascope-parallel-drain.yml \
              --limit 100 \
              --json databaseId,status | \
            jq --arg current "$GITHUB_RUN_ID" '[.[] | select(((.databaseId | tostring) != $current) and (.status != "completed"))] | length'
          )"
          if [ "$other_active" -gt 0 ]; then
            echo "Another active parallel drain already owns successor dispatch; skipping serialized fallback dispatch."
            exit 0
          fi

          if [ "$SERIAL_FALLBACK" = "true" ]; then
            gh workflow run sigmascope.yml --repo "$GITHUB_REPOSITORY" --ref sigmascope
            echo "Parallel drain yielded to serialized SigmaScope: $BLOCKED_REASON"
          else
            echo "No immediately eligible SigmaScope work remains."
          fi
