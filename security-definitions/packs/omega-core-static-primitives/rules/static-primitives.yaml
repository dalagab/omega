schema: omega.sigmascope.ruleset.v1
rules:
  - schema: omega.sigmascope.rule.v1
    id: primitive.network.http
    kind: observation
    status: reviewed
    requires: [staticPatternMatches]
    selectors:
      marker:
        collection: staticPatternMatches
        where:
          pattern:
            in-ci: [System.Net.Http.HttpClient, WebRequest, HttpWebRequest, DownloadString, DownloadData, DownloadFile]
    condition: marker
    emit:
      fact: network.http
      confidence: high
      title: HTTP/network static marker observed
      description: A retained static literal observation matches the reviewed HTTP/network client marker vocabulary.
      category: network

  - schema: omega.sigmascope.rule.v1
