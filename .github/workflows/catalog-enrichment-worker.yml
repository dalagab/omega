name: Omega collector · catalog enrichment

on:
  workflow_call:
    inputs:
      work_id: {required: true, type: string}
      claim_token: {required: true, type: string}
  workflow_dispatch:
    inputs:
      work_id: {required: true, type: string}
      claim_token: {required: true, type: string}

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: omega-worker-catalog-enrichment
  cancel-in-progress: false

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: security-worker-images, path: image-state, persist-credentials: false}
      - id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -er --arg image "catalog-worker" '.images[$image] // empty' image-state/index.json)"
          [[ "$ref" =~ ^ghcr\.io/[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid or missing digest-pinned worker image reference: $ref"; exit 3; }
          echo "image=$ref" >> "$GITHUB_OUTPUT"

  collect:
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v6
        with: {ref: sigmascope, fetch-depth: 1, persist-credentials: true}
      - uses: actions/checkout@v6
        with: {ref: security-work-state, path: catalog/work-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/current-state, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: catalog-discovery-work-state, path: catalog/discovery-lane, fetch-depth: 1, persist-credentials: false}
      - name: Validate exact durable lease and settled discovery input
        shell: bash
        run: |
          set -euo pipefail
          python tools/orchestration/worker_claim.py --work-state catalog/work-state --queue-id catalog-enrichment --work-id "${{ inputs.work_id }}" --owner omega.worker.catalog-enrichment --claim-token "${{ inputs.claim_token }}" --output catalog/work-item.json
          PYTHONPATH=tools/orchestration python - <<'PY'
          import json
          from pathlib import Path
          import work_queue, work_result
          result=work_result.validate_result(Path('catalog/discovery-lane'), expected_queue_id='catalog-discovery')
          queue=work_queue.validate_queue(json.load(open('catalog/work-state/queues/catalog-discovery.json')))
          latest=sorted(queue['items'],key=lambda x:(x['createdAtUtc'],x['workId']))[-1]
          if latest['state']!='completed' or (latest.get('settlement') or {}).get('resultRevision')!=result['resultRevision']:
              raise SystemExit('catalog enrichment refuses an unsettled discovery result')
          Path('catalog/discovery-result-revision.txt').write_text(result['resultRevision'])
          PY
      - name: Compose settled discovery state without performing discovery again
        run: >-
          python tools/orchestration/compose_catalog_sources.py
          --base catalog/discovery-lane/discovery-candidates.json
          --discovery-snapshot catalog/discovery-lane/discovery/source-candidates.json
          --output catalog/raw-sources.json
      - name: Materialize previous catalog cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          if jq -e '
            .schema == "omega.catalog-json.v2" and
            .formatVersion == 2 and
            .identityEpoch == "omega-catalog-identity-v1"
          ' catalog/current-state/catalog/index.json >/dev/null 2>&1; then
            python tools/catalog/catalog_json_store.py materialize \
              --root catalog/current-state/catalog \
              --database catalog/seed/omega-catalog.sqlite
          elif jq -e '
            .schema == "omega.catalog-json.v1" and
            .formatVersion == 1 and
            .identityEpoch == "omega-catalog-identity-v1"
          ' catalog/current-state/catalog/index.json >/dev/null 2>&1 \
            && [ -f catalog/current-state/catalog/identity/model.json ]; then
            # Phase-4-only bridge for our one authoritative pre-cutover catalog-data state.
            # Delete this branch together with catalog_json_v1_seed.py after the migration receipt.
            python tools/catalog/catalog_json_v1_seed.py \
              --root catalog/current-state/catalog \
              --database catalog/seed/omega-catalog.sqlite
          else
            echo "::error::Authoritative catalog-data is neither current v2 nor the exact Phase-4 v1 predecessor."
            exit 6
          fi
      - name: Fetch PluginMaster manifests
        run: >-
          python tools/catalog/enrich_metadata.py
          --input catalog/raw-sources.json
          --output catalog/enriched-sources.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --concurrency 8
          --timeout 20
      - name: Build and publish lease-bound enrichment result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/lane-result
          cp catalog/raw-sources.json catalog/enriched-sources.json catalog/lane-result/
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.load(open('catalog/current-state/catalog/index.json'))
          discovery=Path('catalog/discovery-result-revision.txt').read_text().strip()
          Path('catalog/lane-result/provenance.json').write_text(json.dumps({
            'schema':'omega.catalog-enrichment-provenance.v1',
            'baseCatalogRevision':idx.get('catalogRevision',''),
            'discoveryResultRevision':discovery
          },indent=2,sort_keys=True)+'\n')
          PY
          python tools/orchestration/work_result.py build --queue-id catalog-enrichment --work-item catalog/work-item.json --root catalog/lane-result --worker-image "${{ needs.resolve-image.outputs.image }}" --file raw-sources.json --file enriched-sources.json --file provenance.json
          gh auth setup-git
          python tools/orchestration/publish_lane_state.py --input catalog/lane-result --repo . --branch catalog-enrichment-state --push
      - name: Wake the reconciler after result publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(( $(date -u +%s) - 300 ))"
          recent_count="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow security-orchestration-dispatch.yml \
            --limit 20 \
            --json createdAt,status \
            --jq "[.[] | select((.status == \"queued\" or .status == \"in_progress\") or ((.createdAt | fromdateiso8601) >= ${cutoff_epoch}))] | length")"
          if [ "${recent_count:-0}" != "0" ]; then
            echo "::notice::Recent or active orchestration dispatch exists; skipping duplicate reconcile wake."
            exit 0
          fi
          gh workflow run security-orchestration-dispatch.yml \
            --repo "${{ github.repository }}" \
            --ref sigmascope \
            -f mode=reconcile
