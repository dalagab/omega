name: Report an incorrect scanner result
description: Tell us when Omega or Sigmascope appears to have misunderstood your plugin.
title: "Scanner result correction: "
body:
  - type: markdown
    attributes:
      value: |
        Omega and Sigmascope report evidence from public plugin packages and source code. They can be wrong.

        If you maintain a plugin and believe a security, capability, automation, dependency, source, or other scanner result is inaccurate, please show us what Omega reported and why you believe the evidence was interpreted incorrectly.

        This is not an appeal process or a request for special treatment. It is a way to correct bad scanner evidence or logic so the same mistake can be fixed for everyone.

  - type: input
    id: plugin-name
    attributes:
      label: Plugin name
      placeholder: MyPlugin
    validations:
      required: true

  - type: input
    id: internal-name
    attributes:
      label: InternalName
      description: The Dalamud InternalName, if different from the display name.
      placeholder: MyPlugin.Internal

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version for which you saw the incorrect result.
      placeholder: 1.2.3
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Plugin repository or source URL
      description: Link to the public repository or PluginMaster source Omega used.
      placeholder: https://github.com/example/plugin
    validations:
      required: true

  - type: dropdown
    id: finding-type
    attributes:
      label: What appears to be wrong?
      options:
        - Security finding / severity
        - Capability or permission
        - Automation classification
        - Dependency or advisory
        - Network endpoint
        - Filesystem/path access
        - Source provenance or source-to-binary result
        - Artifact/hash result
        - Repository/source association
        - Other scanner evidence
    validations:
      required: true

  - type: textarea
    id: reported-result
    attributes:
      label: What did Omega or Sigmascope report?
      description: Copy the relevant wording or describe the exact finding. Screenshots are welcome.
      placeholder: Omega reports that the plugin...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: What do you believe the correct result should be?
      description: Explain what the plugin actually does in this area and why the reported result is inaccurate.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Where can we verify this?
      description: Link to the relevant source file, code lines, documentation, release artifact, or other public evidence that shows the scanner got it wrong.
      placeholder: https://github.com/example/plugin/blob/main/...
    validations:
      required: true

  - type: textarea
    id: revisions
    attributes:
      label: Omega / Sigmascope revision information (optional)
      description: If available, include the catalog revision, Definitions revision, Evidence revision, scanner version, or package hash shown by Omega.

  - type: textarea
    id: context
    attributes:
      label: Anything else we should know? (optional)
      description: Add any context that may help reproduce or understand the result.
