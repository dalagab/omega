name: Omega SigmaScope · production parallel queue drain

# Default-branch registration copy. The authoritative implementation lives at this
# same path on branch `sigmascope`; this copy only makes direct/self dispatch possible.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel scanner workers for each production wave (1-8)
        type: number
        required: false
        default: 8
      items_per_worker:
        description: Exact queue keys per worker (1-16; total max 64)
        type: number
        required: false
        default: 8
      wave:
        description: Drain-wave ordinal
        type: number
        required: false
        default: 1
      publish_client_every:
        description: Republish Omega customer DB every N waves
        type: number
        required: false
        default: 5

permissions:
  contents: read

jobs:
  registration-only:
    name: Select the sigmascope branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop accidental main-branch execution
        shell: bash
        run: |
          echo "::error::This main-branch file only registers the production parallel drain in GitHub Actions."
          echo "::error::Run it with Branch = sigmascope; the sigmascope copy contains the real worker/merge/publish implementation."
          exit 2
