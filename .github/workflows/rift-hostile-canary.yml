name: Rift hostile canary

on:
  workflow_dispatch:
  push:
    branches: [rift]
    paths:
      - 'InterdimensionalRift/**'
      - 'InterdimensionalRift.DalamudShim/**'
      - 'tests/fixtures/RiftHostileCanary/**'
      - 'tests/InterdimensionalRift.Tests/**'
      - 'tools/check-hostile-canary-contract.py'
      - 'tools/package-hostile-canary.sh'
      - 'tools/run-rift-bwrap.sh'
      - 'tools/seccomp/**'
      - '.github/workflows/rift-hostile-canary.yml'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install boundary/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap libcap2-bin libseccomp-dev gcc pkg-config unzip zip

      - name: Enable and verify hostile-code boundary
        run: |
          sudo bash ./tools/enable-userns-github.sh
          bash ./tools/verify-bwrap.sh
          bash ./tools/verify-rift-cgroup.sh

      - name: Verify hostile canary source contract
        run: python3 ./tools/check-hostile-canary-contract.py

      - name: Download Dalamud API runtime
        run: |
          set -euo pipefail
          hooks="$RUNNER_TEMP/dalamud-hooks"
          mkdir -p "$hooks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' \
            -o "$RUNNER_TEMP/dalamud.zip"
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$hooks"
          test -s "$hooks/Dalamud.dll"
          echo "RIFT_HOOKS=$hooks" >> "$GITHUB_ENV"

      - name: Build/test Rift and canary
        run: |
          set -euo pipefail
          dotnet test ./tests/InterdimensionalRift.Tests/InterdimensionalRift.Tests.csproj \
            --configuration Release -p:HooksDir="$RIFT_HOOKS"
          dotnet publish ./InterdimensionalRift/InterdimensionalRift.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:HooksDir="$RIFT_HOOKS" --output "$RUNNER_TEMP/rift-runtime"
          test -x "$RUNNER_TEMP/rift-runtime/interdimensional-rift"

      - name: Build deliberately non-installable canary artifact
        id: package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rift-hostile-canary.zip"
          # Build was already done by dotnet test. Package only the DLL: absolutely no JSON.
          dll=$(find ./tests/fixtures/RiftHostileCanary/bin/Release -type f -name RiftHostileCanary.dll -print -quit)
          test -s "$dll"
          stage="$RUNNER_TEMP/canary-package"
          mkdir -p "$stage"
          cp "$dll" "$stage/RiftHostileCanary.dll"
          (cd "$stage" && zip -q -9 "$out" RiftHostileCanary.dll)
          test "$(unzip -Z1 "$out" | sed '/^$/d')" = 'RiftHostileCanary.dll'
          if unzip -Z1 "$out" | grep -Eiq '\.json$'; then
            echo 'hostile canary artifact unexpectedly contains JSON' >&2
            exit 1
          fi
          sha256sum "$out" | tee "$RUNNER_TEMP/rift-hostile-canary.zip.sha256"
          echo "zip=$out" >> "$GITHUB_OUTPUT"

      - name: Stage canary DLL from its opaque package
        id: stage
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/rift-hostile-canary-artifact"
          mkdir -p "$artifact"
          unzip -q '${{ steps.package.outputs.zip }}' -d "$artifact"
          test -s "$artifact/RiftHostileCanary.dll"
          find "$artifact" -type f -name '*.json' -print -quit | (! grep .)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "plugin=$artifact/RiftHostileCanary.dll" >> "$GITHUB_OUTPUT"

      - name: Build seccomp policy
        run: |
          policy=$(bash ./tools/build-rift-seccomp.sh "$RUNNER_TEMP/rift-seccomp.bpf")
          test -s "$policy"
          echo "RIFT_SECCOMP=$policy" >> "$GITHUB_ENV"

      - name: Execute hostile canary inside Rift
        id: execute
        run: |
          set +e
          results="$RUNNER_TEMP/rift-hostile-canary-results"
          mkdir -p "$results"
          bash ./tools/run-rift-bwrap.sh \
            --runtime-dir "$RUNNER_TEMP/rift-runtime" \
            --plugin '${{ steps.stage.outputs.plugin }}' \
            --artifact-dir '${{ steps.stage.outputs.artifact }}' \
            --seccomp-policy "$RIFT_SECCOMP" \
            --out "$results/rift-hostile-canary.json" \
            --init-timeout 10 --wall-timeout 20 \
            --memory-max 256M --tasks-max 32 --cpu-quota 100%
          rc=$?
          echo "$rc" > "$results/rift-exit-code.txt"
          cp "$RUNNER_TEMP/rift-hostile-canary.zip.sha256" "$results/"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify runtime alarm markers
        run: |
          python3 - "$RUNNER_TEMP/rift-hostile-canary-results/rift-hostile-canary.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding='utf-8'))
          text=json.dumps(report)
          required=[
            'RIFT_CANARY armed inside Rift',
            'runtime.filesystem.tmpfs',
            'runtime.network.loopback',
            'runtime.http.loopback',
            'runtime.process.missing',
            'runtime.assembly.missing',
            'runtime.native-load.missing',
            'runtime.registry.readonly',
            'runtime.pinvoke.getpid',
            'runtime.framework.tick',
          ]
          missing=[m for m in required if m not in text]
          if missing:
              raise SystemExit('missing Rift canary runtime markers: '+', '.join(missing))
          print('Rift hostile canary runtime markers: PASS')
          PY

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rift-hostile-canary-results
          path: ${{ runner.temp }}/rift-hostile-canary-results
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Rift exit after preserving report
        if: always()
        run: |
          rc=$(cat "$RUNNER_TEMP/rift-hostile-canary-results/rift-exit-code.txt" 2>/dev/null || echo 99)
          test "$rc" = 0
