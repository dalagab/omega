name: Omega SQLite catalog compactor

on:
  push:
    branches:
      - main
    paths:
      - "tools/catalog/compact_sqlite_catalog.py"
      - "tools/catalog/catalog_revisions.py"
      - "tools/catalog/publication_decision.py"
      - "tools/catalog/validate_compacted_catalog.py"
      - ".github/workflows/catalog-compaction.yml"
  workflow_run:
    workflows:
      - "Omega plugin security scanner"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: omega-catalog-publish
  cancel-in-progress: false

jobs:
  compact:
    name: Compact security-enriched catalog
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      catalog_revision: ${{ steps.publication.outputs.catalog_revision }}
      security_revision: ${{ steps.publication.outputs.security_revision }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run repository Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Self-test compaction and history preservation
        run: python tools/catalog/compact_sqlite_catalog.py --self-test

      - name: Download security handoff and previous production revision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p catalog/compaction-input catalog/previous
          if gh release view catalog-latest --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release download catalog-latest \
              --repo "$GH_REPO" \
              --pattern omega-catalog.sqlite.zip \
              --pattern catalog.json \
              --dir catalog/previous
            gh release download catalog-latest --repo "$GH_REPO" --pattern catalog-report.json --dir catalog/previous || true
            gh release download catalog-latest --repo "$GH_REPO" --pattern security-report.json --dir catalog/previous || true
            gh release download catalog-latest --repo "$GH_REPO" --pattern security-scan-ledger.json --dir catalog/previous || true
          fi
          if [ -f catalog/previous/omega-catalog.sqlite.zip ]; then
            python -m zipfile -e catalog/previous/omega-catalog.sqlite.zip catalog/previous
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run download "$UPSTREAM_RUN_ID" \
              --repo "$GH_REPO" \
              --name omega-security-catalog \
              --dir catalog/compaction-input
          else
            cp catalog/previous/omega-catalog.sqlite.zip catalog/compaction-input/
            cp catalog/previous/catalog.json catalog/compaction-input/
            if [ -f catalog/previous/catalog-report.json ]; then
              cp catalog/previous/catalog-report.json catalog/compaction-input/
            fi
            if [ -f catalog/previous/security-report.json ]; then
              cp catalog/previous/security-report.json catalog/compaction-input/
            fi
            if [ -f catalog/previous/security-scan-ledger.json ]; then
              cp catalog/previous/security-scan-ledger.json catalog/compaction-input/
            fi
          fi
          test -f catalog/compaction-input/omega-catalog.sqlite.zip
          test -f catalog/compaction-input/catalog.json
          python -m zipfile -e catalog/compaction-input/omega-catalog.sqlite.zip catalog/compaction-input

      - name: Compact database and rebuild transport bundle
        run: >-
          python tools/catalog/compact_sqlite_catalog.py
          --database catalog/compaction-input/omega-catalog.sqlite
          --descriptor catalog/compaction-input/catalog.json
          --output-dir catalog/compaction-output
          --report catalog/compaction-output/compaction-report.json
          --previous-database catalog/previous/omega-catalog.sqlite
          --previous-descriptor catalog/previous/catalog.json

      - name: Preserve operator reports
        shell: bash
        run: |
          set -euo pipefail
          if [ -f catalog/compaction-input/catalog-report.json ]; then
            cp catalog/compaction-input/catalog-report.json catalog/compaction-output/catalog-report.json
          elif [ -f catalog/previous/catalog-report.json ]; then
            cp catalog/previous/catalog-report.json catalog/compaction-output/catalog-report.json
          fi
          if [ -f catalog/compaction-input/security-report.json ]; then
            cp catalog/compaction-input/security-report.json catalog/compaction-output/security-report.json
          fi
          if [ -f catalog/compaction-input/security-scan-ledger.json ]; then
            cp catalog/compaction-input/security-scan-ledger.json catalog/compaction-output/security-scan-ledger.json
          elif [ -f catalog/previous/security-scan-ledger.json ]; then
            cp catalog/previous/security-scan-ledger.json catalog/compaction-output/security-scan-ledger.json
          fi

      - name: Validate compacted production catalog
        run: python tools/catalog/validate_compacted_catalog.py --root catalog/compaction-output

      - name: Resolve semantic publication decision
        id: publication
        run: >-
          python tools/catalog/publication_decision.py
          --report catalog/compaction-output/compaction-report.json
          --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: omega-compacted-catalog
          path: |
            catalog/compaction-output/omega-catalog.sqlite.zip
            catalog/compaction-output/omega-catalog.sqlite.zip.sha256
            catalog/compaction-output/catalog.json
            catalog/compaction-output/catalog-report.json
            catalog/compaction-output/compaction-report.json
            catalog/compaction-output/security-report.json
            catalog/compaction-output/security-scan-ledger.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish compacted production catalog
    needs: compact
    if: needs.compact.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omega-compacted-catalog
          path: catalog/compaction-output

      - name: Replace stable catalog assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            catalog/compaction-output/omega-catalog.sqlite.zip
            catalog/compaction-output/omega-catalog.sqlite.zip.sha256
            catalog/compaction-output/catalog.json
            catalog/compaction-output/compaction-report.json
          )
          if [ -f catalog/compaction-output/catalog-report.json ]; then
            assets+=(catalog/compaction-output/catalog-report.json)
          fi
          if [ -f catalog/compaction-output/security-report.json ]; then
            assets+=(catalog/compaction-output/security-report.json)
          fi
          if [ -f catalog/compaction-output/security-scan-ledger.json ]; then
            assets+=(catalog/compaction-output/security-scan-ledger.json)
          fi
          if ! gh release view catalog-latest --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create catalog-latest \
              --repo "$GH_REPO" \
              --title "Omega catalog database" \
              --notes "Automatically generated Omega marketplace catalog. Assets are replaced only when the semantic catalog state or required database representation changes."
          fi
          gh release upload catalog-latest "${assets[@]}" --repo "$GH_REPO" --clobber

      - name: Verify published compacted catalog
        run: >-
          python tools/catalog/validate_compacted_catalog.py
          --base-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/"


  publish_scan_ledger:
    name: Publish scan freshness ledger without replacing catalog
    needs: compact
    if: needs.compact.outputs.publish == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omega-compacted-catalog
          path: catalog/compaction-output
      - name: Replace operational scan ledger only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f catalog/compaction-output/security-scan-ledger.json ]; then
            echo "No scan ledger was produced; nothing to publish."
            exit 0
          fi
          if ! gh release view catalog-latest --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Production catalog release does not exist; refusing ledger-only publication." >&2
            exit 1
          fi
          gh release upload catalog-latest \
            catalog/compaction-output/security-scan-ledger.json \
            --repo "$GH_REPO" \
            --clobber
