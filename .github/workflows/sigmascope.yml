name: Omega security services · Sigmascope launcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      internal_names:
        description: "Optional comma-separated InternalName allow-list for a bounded developer run"
        type: string
        required: false
        default: ""
      workers:
        description: "Production parallel drain workers when internal_names is empty (1-8)"
        type: number
        required: false
        default: 4
      items_per_worker:
        description: "Exact queue items per production worker (1-16; total max 64)"
        type: number
        required: false
        default: 10

permissions:
  contents: write
  issues: write
  actions: write
  packages: read

jobs:
  production-drain-wake:
    if: ${{ (inputs.internal_names || '') == '' }}
    uses: dalagab/omega/.github/workflows/sigmascope-drain-wake.yml@sigmascope
    with:
      workers: ${{ inputs.workers || 4 }}
      items_per_worker: ${{ inputs.items_per_worker || 10 }}
      publish_client_every: 5
    secrets: inherit

  bounded-developer-run:
    if: ${{ (inputs.internal_names || '') != '' }}
    uses: dalagab/omega/.github/workflows/sigmascope.yml@sigmascope
    with:
      internal_names: ${{ inputs.internal_names }}
    secrets: inherit
