name: Omega SQLite catalog builder

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel repository fetchers"
        type: string
        required: false
        default: "8"
      timeout:
        description: "Per-request timeout in seconds"
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        description: "Reuse successful website enrichment for this many hours"
        type: string
        required: false
        default: "168"

permissions:
  contents: write

concurrency:
  group: omega-catalog-publish
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    name: 1) Discover source feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Discover curated, Puni.sh and GitHub PluginMaster sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/collect_sources.py
          --curated sources/curated-sources.json
          --output catalog/raw-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: raw-sources
          path: catalog/raw-sources.json
          retention-days: 7

  enrich:
    name: 2) Fetch and normalize manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: raw-sources
          path: catalog/
      - name: Download previous SQLite catalog for conditional manifest requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --pattern omega-catalog.sqlite.zip --dir catalog/seed || true
          if [ -f catalog/seed/omega-catalog.sqlite.zip ]; then
            python - <<'PY'
          import zipfile
          with zipfile.ZipFile('catalog/seed/omega-catalog.sqlite.zip') as zf:
              zf.extract('omega-catalog.sqlite', 'catalog/seed')
          PY
          fi
      - name: Fetch PluginMaster feeds
        run: >-
          python tools/catalog/enrich_metadata.py
          --input catalog/raw-sources.json
          --output catalog/enriched-sources.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --concurrency ${{ inputs.concurrency || '8' }}
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v4
        with:
          name: enriched-sources
          path: catalog/enriched-sources.json
          retention-days: 7

  scrape:
    name: 3) Incrementally enrich public project pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: enrich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: enriched-sources
          path: catalog/
      - name: Download previous SQLite catalog for enrichment cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --pattern omega-catalog.sqlite.zip --dir catalog/seed || true
          if [ -f catalog/seed/omega-catalog.sqlite.zip ]; then
            python - <<'PY'
          import zipfile
          with zipfile.ZipFile('catalog/seed/omega-catalog.sqlite.zip') as zf:
              zf.extract('omega-catalog.sqlite', 'catalog/seed')
          PY
          fi
      - name: Reuse fresh enrichment and scrape only new/stale project pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/catalog/scrape_websites_incremental.py
          --input catalog/enriched-sources.json
          --output catalog/website-enrichment.json
          --seed-database catalog/seed/omega-catalog.sqlite
          --max-age-hours ${{ inputs.website_max_age_hours || '168' }}
          --concurrency 4
          --timeout ${{ inputs.timeout || '20' }}
      - uses: actions/upload-artifact@v4
        with:
          name: website-enrichment
          path: catalog/website-enrichment.json
          retention-days: 7

  build:
    name: 4) Build, validate and publish SQLite catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [collect, enrich, scrape]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: raw-sources
          path: catalog/
      - uses: actions/download-artifact@v4
        with:
          name: enriched-sources
          path: catalog/
      - uses: actions/download-artifact@v4
        with:
          name: website-enrichment
          path: catalog/
      - name: Download previous SQLite database seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          gh release download catalog-latest --pattern omega-catalog.sqlite.zip --dir catalog/seed || true
      - name: Run SQLite catalog self-test
        run: python tools/catalog/test_sqlite_catalog.py
      - name: Build one authoritative SQLite catalog
        run: >-
          python tools/catalog/build_sqlite_catalog.py
          --out catalog/dist
          --seed catalog/seed/omega-catalog.sqlite.zip
          --curated sources/curated-sources.json
          --raw-sources catalog/raw-sources.json
          --enriched-sources catalog/enriched-sources.json
          --website-enrichment catalog/website-enrichment.json
          --download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-catalog.sqlite.zip"
          --descriptor-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/catalog.json"
      - name: Validate generated database
        shell: bash
        run: |
          python - <<'PY'
          import json, sqlite3
          db=sqlite3.connect('catalog/dist/omega-catalog.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert int(db.execute("select value from catalog_meta where key='schema_version'").fetchone()[0]) == 1
          assert db.execute('select count(*) from runtime_plugin_variants').fetchone()[0] > 0
          print(json.dumps(dict(db.execute('select key,value from catalog_meta')), indent=2))
          PY
      - name: Update endpoint and human-readable report only
        shell: bash
        run: |
          set -euo pipefail
          cp catalog/dist/catalog-endpoint.json catalog/catalog-endpoint.json
          cp catalog/dist/catalog-report.json catalog/latest-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog-endpoint.json catalog/latest-report.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: refresh SQLite report [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: omega-sqlite-catalog
          path: |
            catalog/dist/omega-catalog.sqlite
            catalog/dist/omega-catalog.sqlite.zip
            catalog/dist/omega-catalog.sqlite.zip.sha256
            catalog/dist/catalog.json
            catalog/dist/catalog-endpoint.json
            catalog/dist/catalog-report.json
            catalog/dist/debug/*.json
          retention-days: 30
      - name: Publish stable catalog release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view catalog-latest >/dev/null 2>&1; then
            gh release create catalog-latest \
              --title "Omega SQLite catalog" \
              --notes "Automatically generated Omega marketplace database. The release tag stays stable while assets are replaced."
          fi
          gh release upload catalog-latest \
            catalog/dist/omega-catalog.sqlite.zip \
            catalog/dist/omega-catalog.sqlite.zip.sha256 \
            catalog/dist/catalog.json \
            catalog/dist/catalog-report.json \
            --clobber
      - name: Verify published descriptor and bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request, zipfile, io, sqlite3, tempfile, os
          base='https://github.com/${{ github.repository }}/releases/download/catalog-latest/'
          d=json.load(urllib.request.urlopen(base+'catalog.json'))
          b=urllib.request.urlopen(base+'omega-catalog.sqlite.zip').read()
          assert hashlib.sha256(b).hexdigest() == d['bundleSha256']
          with zipfile.ZipFile(io.BytesIO(b)) as zf:
              raw=zf.read('omega-catalog.sqlite')
          assert hashlib.sha256(raw).hexdigest() == d['catalogSha256']
          fd,path=tempfile.mkstemp(suffix='.sqlite'); os.close(fd)
          open(path,'wb').write(raw)
          db=sqlite3.connect(path)
          assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
          os.unlink(path)
          print('Published SQLite catalog verified.')
          PY
