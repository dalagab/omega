name: Omega collector · source HEAD observation

on:
  workflow_dispatch:
    inputs:
      work_id: {required: true, type: string}
      claim_token: {required: true, type: string}

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: omega-worker-source-head
  cancel-in-progress: false

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs: {image: "${{ steps.image.outputs.image }}"}
    steps:
      - uses: actions/checkout@v6
        with: {ref: security-worker-images, path: image-state, persist-credentials: false}
      - id: image
        shell: bash
        run: echo "image=$(jq -r '.images[\"catalog-worker\"]' image-state/index.json)" >> "$GITHUB_OUTPUT"
  collect:
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v6
        with: {ref: sigmascope, persist-credentials: true}
      - uses: actions/checkout@v6
        with: {ref: security-work-state, path: catalog/work-state, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/current-state, persist-credentials: false}
      - name: Validate exact durable lease
        run: >-
          python tools/orchestration/worker_claim.py --work-state catalog/work-state --queue-id source-head-observation --work-id "${{ inputs.work_id }}" --owner omega.worker.source-head --claim-token "${{ inputs.claim_token }}" --output catalog/work-item.json
      - name: Observe public source HEAD revisions
        run: >-
          python tools/catalog/source_revision_observer.py --catalog-root catalog/current-state/catalog --output catalog/source-revision-observations.json --timeout 12 --concurrency 16
      - name: Build and publish lease-bound source-head result
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/lane-result
          cp catalog/source-revision-observations.json catalog/lane-result/
          python - <<'PY'
          import json
          from pathlib import Path
          idx=json.load(open('catalog/current-state/catalog/index.json'))
          Path('catalog/lane-result/provenance.json').write_text(json.dumps({'schema':'omega.source-head-provenance.v1','baseCatalogRevision':idx.get('catalogRevision','')},indent=2,sort_keys=True)+'\n')
          PY
          python tools/orchestration/work_result.py build --queue-id source-head-observation --work-item catalog/work-item.json --root catalog/lane-result --worker-image "${{ needs.resolve-image.outputs.image }}" --file source-revision-observations.json --file provenance.json
          gh auth setup-git
          python tools/orchestration/publish_lane_state.py --input catalog/lane-result --repo . --branch source-head-state --push
      - name: Wake the reconciler after result publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          gh workflow run security-reconcile.yml
          --repo "${{ github.repository }}"
          --ref sigmascope
