name: Omega security services · daily catalog launcher

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Parallel repository fetchers"
        type: string
        required: false
        default: "8"
      timeout:
        description: "Per-request timeout in seconds"
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        description: "Reuse successful website enrichment for this many hours"
        type: string
        required: false
        default: "168"
      allow_source_removal:
        description: "Allow an intentional removal from the previous canonical source registry"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  issues: write
  packages: read

jobs:
  call-security-branch:
    uses: dalagab/omega/.github/workflows/catalog-builder.yml@sigmascope
    with:
      concurrency: ${{ inputs.concurrency || '8' }}
      timeout: ${{ inputs.timeout || '20' }}
      website_max_age_hours: ${{ inputs.website_max_age_hours || '168' }}
      allow_source_removal: ${{ inputs.allow_source_removal || false }}
    secrets: inherit
