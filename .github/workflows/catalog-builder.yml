name: Omega catalog freeze worker

on:
  workflow_call:
    inputs:
      concurrency:
        type: string
        required: false
        default: "8"
      timeout:
        type: string
        required: false
        default: "20"
      website_max_age_hours:
        type: string
        required: false
        default: "168"
      allow_source_removal:
        type: boolean
        required: false
        default: false
      authority_lock_held:
        description: Internal only; the caller already owns omega-catalog-sigmascope-exclusive
        type: boolean
        required: false
        default: false
    outputs:
      freeze_changed:
        description: Whether the authoritative catalog/Definitions freeze changed semantically
        value: ${{ jobs.publish.outputs.freeze_changed }}
  workflow_dispatch:
    inputs:
      allow_source_removal:
        description: "Allow an intentional removal from the previous canonical source registry"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  packages: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  # A standalone freeze owns the global catalog/Evidence writer mutex itself. During the
  # automatic Phase-4 migration the outer cutover core already owns that mutex, so the nested
  # freeze must use a run-local group instead of recursively waiting on its own authority lock.
  group: ${{ inputs.authority_lock_held && format('omega-catalog-freeze-under-phase4-{0}', github.run_id) || 'omega-catalog-sigmascope-exclusive' }}
  cancel-in-progress: false
  queue: max

# Release boundary only. All network-heavy collection is performed by independently leased
# workers before this workflow starts. This job consumes settled working state and can no-op.

jobs:
  resolve-publisher-image:
    name: Resolve immutable publisher toolchain
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-worker-images
          path: image-state
          persist-credentials: false
      - id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -er --arg image "publisher-worker" '.images[$image] // empty' image-state/index.json)"
          [[ "$ref" =~ ^ghcr\.io/[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid or missing digest-pinned worker image reference: $ref"; exit 3; }
          echo "image=$ref" >> "$GITHUB_OUTPUT"

  preflight:
    name: Validate catalog contracts
    needs: resolve-publisher-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.resolve-publisher-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify frozen publisher toolchain
        run: |
          python -c "import yaml; print('PyYAML', yaml.__version__)"
          yara --version
      - name: Run catalog/orchestration regression gates
        env:
          PYTHONPATH: .:tools/tests:tools/catalog
        run: |
          python -m unittest tools.tests.test_work_queue tools.tests.test_orchestration_contracts -v
          python -m unittest \
            tools.tests.test_catalog_json_snapshots.CatalogJsonSnapshotTests.test_canonical_json_round_trips_base_catalog_exactly \
            tools.tests.test_catalog_json_snapshots.CatalogJsonSnapshotTests.test_catalog_json_has_one_current_internal_format_and_no_legacy_identity_reader \
            tools.tests.test_catalog_json_snapshots.CatalogJsonSnapshotTests.test_identity_rows_over_16_mib_are_sharded_and_round_trip \
            tools.tests.test_catalog_json_snapshots.CatalogJsonSnapshotTests.test_phase4_v1_seed_converter_preserves_exact_integer_identities \
            -v
          python tools/catalog/test_sqlite_catalog.py
          python tools/catalog/project_marketplace_catalog.py --self-test

  publish:
    name: Freeze coherent authoritative catalog/Definitions state
    needs: [resolve-publisher-image, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: ${{ needs.resolve-publisher-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      discord_notice_ready: ${{ steps.discord_notice.outcome == 'success' && steps.freeze_identity.outputs.changed == 'true' }}
      freeze_changed: ${{ steps.freeze_identity.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Allow container Git access to the checked-out workflow source
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Record security-services source commit
        id: security_source
        shell: bash
        env:
          SECURITY_SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SECURITY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid immutable security-services source SHA: $SECURITY_SOURCE_SHA"; exit 3; }
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$SECURITY_SOURCE_SHA" || {
            echo "::error::Reusable workflow source mismatch: workflow=$SECURITY_SOURCE_SHA checkout=$checked_out_sha"
            exit 4
          }
          echo "sha=$SECURITY_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout authoritative Security Evidence v2
        uses: actions/checkout@v6
        with: {ref: security-evidence-v2, path: catalog/security-v2-current, fetch-depth: 1, persist-credentials: false}
      - name: Checkout previous frozen catalog state
        uses: actions/checkout@v6
        with: {ref: catalog-data, path: catalog/previous-state, fetch-depth: 1, persist-credentials: false}
      - name: Checkout durable security work state
        uses: actions/checkout@v6
        with: {ref: security-work-state, path: catalog/work-state, fetch-depth: 1, persist-credentials: false}
      - name: Checkout catalog discovery lane result
        uses: actions/checkout@v6
        with: {ref: catalog-discovery-work-state, path: catalog/lane-results/catalog-discovery, fetch-depth: 1, persist-credentials: false}
      - name: Checkout catalog enrichment lane result
        uses: actions/checkout@v6
        with: {ref: catalog-enrichment-state, path: catalog/lane-results/catalog-enrichment, fetch-depth: 1, persist-credentials: false}
      - name: Checkout website scrape lane result
        uses: actions/checkout@v6
        with: {ref: catalog-scrape-state, path: catalog/lane-results/catalog-scrape, fetch-depth: 1, persist-credentials: false}
      - name: Checkout source HEAD observation lane result
        uses: actions/checkout@v6
        with: {ref: source-head-state, path: catalog/lane-results/source-head-observation, fetch-depth: 1, persist-credentials: false}
      - name: Checkout threat-intelligence lane result
        uses: actions/checkout@v6
        with: {ref: threat-intelligence-state, path: catalog/lane-results/threat-intelligence, fetch-depth: 1, persist-credentials: false}
      - name: Checkout OSV advisory lane result
        uses: actions/checkout@v6
        with: {ref: osv-advisory-state, path: catalog/lane-results/osv-advisories, fetch-depth: 1, persist-credentials: false}
      - name: Checkout external-analysis sources lane result
        uses: actions/checkout@v6
        with: {ref: external-analysis-state, path: catalog/lane-results/external-analysis-sources, fetch-depth: 1, persist-credentials: false}
      - name: Checkout secondary-security definitions lane result
        uses: actions/checkout@v6
        with: {ref: secondary-security-state, path: catalog/lane-results/secondary-security-definitions, fetch-depth: 1, persist-credentials: false}
      - name: Wait for exact settled catalog and collector inputs / Validate all lane results against settled durable queues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          validate_inputs() {
            python tools/orchestration/freeze_inputs.py \
              --work-state catalog/work-state \
              --policy security-definitions/orchestration/work-policy.json \
              --lanes-root catalog/lane-results \
              --catalog-root catalog/previous-state/catalog \
              --output catalog/freeze-inputs.json \
              >catalog/freeze-readiness.out 2>catalog/freeze-readiness.err
          }

          refresh_branch() {
            local path="$1"
            local ref="$2"
            git -C "$path" fetch --quiet --depth=1 origin "$ref"
            git -C "$path" reset --quiet --hard FETCH_HEAD
          }

          refresh_inputs() {
            refresh_branch catalog/work-state security-work-state
            refresh_branch catalog/lane-results/catalog-discovery catalog-discovery-work-state
            refresh_branch catalog/lane-results/catalog-enrichment catalog-enrichment-state
            refresh_branch catalog/lane-results/catalog-scrape catalog-scrape-state
            refresh_branch catalog/lane-results/source-head-observation source-head-state
            refresh_branch catalog/lane-results/threat-intelligence threat-intelligence-state
            refresh_branch catalog/lane-results/osv-advisories osv-advisory-state
            refresh_branch catalog/lane-results/external-analysis-sources external-analysis-state
            refresh_branch catalog/lane-results/secondary-security-definitions secondary-security-state
          }

          wake_reconcile() {
            local attempt
            for attempt in 1 2 3; do
              if gh workflow run security-orchestration-dispatch.yml \
                --repo "${{ github.repository }}" --ref sigmascope -f mode=reconcile; then
                return 0
              fi
              echo "::warning::Reconcile dispatch attempt $attempt failed while preparing catalog freeze"
              sleep $((attempt * 5))
            done
            return 1
          }

          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            if validate_inputs; then
              cat catalog/freeze-readiness.out
              echo "::notice::Catalog freeze inputs are exact and settled on attempt $attempt."
              break
            fi

            reason="$(tail -n 1 catalog/freeze-readiness.err || true)"
            if ! grep -Eq \
              'latest work is .*not completed|was not collected against current catalog revision|result revision is not the settled result|result SHA-256 is not the settled result|catalog enrichment did not consume the settled discovery result|website scraper did not consume the settled enrichment result' \
              catalog/freeze-readiness.err; then
              cat catalog/freeze-readiness.err >&2
              echo "::error::Catalog freeze readiness failed for a non-transient validation reason: $reason"
              exit 5
            fi

            echo "::notice::Catalog freeze is waiting for collector convergence ($attempt/$max_attempts): $reason"
            if (( attempt == 1 || attempt % 5 == 0 )); then
              wake_reconcile || echo "::warning::Collector reconciliation wake failed; the scheduled heartbeat may recover it."
            fi
            if (( attempt == max_attempts )); then
              cat catalog/freeze-readiness.err >&2
              echo "::error::Catalog-bound collectors did not converge within ${max_attempts} minutes."
              exit 6
            fi
            sleep 60
            refresh_inputs
          done
      - name: Stage settled catalog working state
        shell: bash
        run: |
          set -euo pipefail
          cp catalog/lane-results/catalog-enrichment/raw-sources.json catalog/raw-sources.json
          cp catalog/lane-results/catalog-enrichment/enriched-sources.json catalog/enriched-sources.json
          cp catalog/lane-results/catalog-scrape/website-enrichment.json catalog/website-enrichment.json
      - name: Materialize exact previous catalog identity as normalization seed
        id: previous_catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/seed
          echo "current=false" >> "$GITHUB_OUTPUT"
          if jq -e '
            .schema == "omega.catalog-json.v2" and
            .formatVersion == 2 and
            .identityEpoch == "omega-catalog-identity-v1"
          ' catalog/previous-state/catalog/index.json >/dev/null 2>&1; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            python tools/catalog/catalog_json_store.py materialize --root catalog/previous-state/catalog --database catalog/seed/omega-catalog.sqlite
          elif jq -e '
            .schema == "omega.catalog-json.v1" and
            .formatVersion == 1 and
            .identityEpoch == "omega-catalog-identity-v1"
          ' catalog/previous-state/catalog/index.json >/dev/null 2>&1 \
            && [ -f catalog/previous-state/catalog/identity/model.json ]; then
            # Phase-4-only conversion of our one authoritative GitHub state. This is not
            # a supported compatibility format and should be removed after cutover.
            python tools/catalog/catalog_json_v1_seed.py \
              --root catalog/previous-state/catalog \
              --database catalog/seed/omega-catalog.sqlite
          else
            echo "::error::The authoritative previous catalog is neither the current internal format nor the exact Phase-4 predecessor."
            exit 6
          fi
      - name: Normalize settled discovery/enrichment into canonical working catalog
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --out catalog/normalized
            --curated sources/curated-sources.json
            --community sources/community-sources.json
            --raw-sources catalog/raw-sources.json
            --enriched-sources catalog/enriched-sources.json
            --website-enrichment catalog/website-enrichment.json
            --download-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/omega-marketplace.sqlite.zip"
            --descriptor-url "https://github.com/${{ github.repository }}/releases/download/catalog-latest/catalog.json"
          )
          if [ -f catalog/seed/omega-catalog.sqlite ]; then args+=(--seed catalog/seed/omega-catalog.sqlite); fi
          python tools/catalog/build_sqlite_catalog.py "${args[@]}"
      - name: Export canonical public JSON catalog
        run: >-
          python tools/catalog/catalog_json_store.py export
          --database catalog/normalized/omega-catalog.sqlite
          --output catalog/state-catalog
          --built-from-dev-commit "${{ steps.security_source.outputs.sha }}"
      - name: Validate canonical source inventory and retention
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --raw catalog/raw-sources.json
            --enriched catalog/enriched-sources.json
            --catalog-root catalog/state-catalog
            --curated sources/curated-sources.json
            --community sources/community-sources.json
            --aliases sources/source-url-aliases.json
            --report catalog/source-inventory.json
          )
          if [ "${{ steps.previous_catalog.outputs.current }}" = "true" ]; then args+=(--previous-catalog-root catalog/previous-state/catalog); fi
          if [ "${{ inputs.allow_source_removal || false }}" = "true" ]; then args+=(--allow-source-removal); fi
          python tools/catalog/source_inventory_guard.py "${args[@]}"
      - name: Freeze Definitions only from settled collector outputs
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --evidence-root catalog/security-v2-current
            --output catalog/state-definitions
            --built-from-dev-commit "${{ steps.security_source.outputs.sha }}"
            --source-observations catalog/lane-results/source-head-observation/source-revision-observations.json
            --reputation-input catalog/lane-results/threat-intelligence/reputation-intelligence.json
            --advisories-input catalog/lane-results/osv-advisories/osv-advisories.json
            --external-analysis-input catalog/lane-results/external-analysis-sources/external-analysis-sources.json
          )
          if [ -f catalog/lane-results/secondary-security-definitions/secondary-security-asset-manifest.json ]; then
            args+=(--secondary-security-asset-manifest catalog/lane-results/secondary-security-definitions/secondary-security-asset-manifest.json)
          fi
          python tools/catalog/definitions_snapshot.py build "${args[@]}"
      - name: Build deterministic SigmaScope queue seed
        run: >-
          python tools/catalog/scan_queue.py build-seed
          --catalog-root catalog/state-catalog
          --definitions-root catalog/state-definitions
          --evidence-root catalog/security-v2-current
          --output catalog/state-scan-queue.json
      - name: Assemble and validate named catalog/Definitions snapshot
        run: |
          python tools/catalog/catalog_state.py assemble --catalog catalog/state-catalog --definitions catalog/state-definitions --queue-seed catalog/state-scan-queue.json --source-inventory catalog/source-inventory.json --output catalog/state
          python tools/catalog/catalog_state.py validate --root catalog/state
      - name: Compute semantic freeze identity and no-op unchanged freezes
        id: freeze_identity
        shell: bash
        run: |
          set -euo pipefail
          args=(--state-root catalog/state --evidence-root catalog/security-v2-current --work-inputs catalog/freeze-inputs.json --repo-root . --output catalog/state/freeze.json)
          if [ -f catalog/previous-state/freeze.json ]; then args+=(--previous catalog/previous-state/freeze.json); fi
          python tools/orchestration/catalog_freeze_identity.py "${args[@]}"
          changed="$(python -c "import json; print(str(json.load(open('catalog/state/freeze.json'))['changed']).lower())")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" != true ]; then echo "::notice::Catalog, Definitions, Evidence and publisher semantics are unchanged; authoritative freeze is a no-op."; fi
      - name: Publish changed frozen JSON state atomically
        if: steps.freeze_identity.outputs.changed == 'true'
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          python tools/catalog/publish_catalog_state.py --input catalog/state --repo . --branch catalog-data --history-mode fast-forward --push \
            | tee catalog/catalog-history-publication.json
      - name: Wake collector reconciliation after catalog publication
        if: steps.freeze_identity.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run security-orchestration-dispatch.yml \
              --repo "${{ github.repository }}" --ref sigmascope -f mode=reconcile; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Build a sanitised Discord catalog notice
        id: discord_notice
        if: steps.freeze_identity.outputs.changed == 'true'
        continue-on-error: true
        run: >-
          python tools/notifications/discord_notice.py catalog
          --catalog-index catalog/state/catalog/index.json
          --previous-catalog-index catalog/previous-state/catalog/index.json
          --definitions-index catalog/state/definitions/index.json
          --previous-definitions-index catalog/previous-state/definitions/index.json
          --repository "${{ github.repository }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output catalog/discord-notice.json
      - name: Upload Discord catalog notice
        if: steps.discord_notice.outcome == 'success'
        uses: actions/upload-artifact@v7
        with: {name: omega-catalog-discord-notice, path: catalog/discord-notice.json, if-no-files-found: error, retention-days: 1}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omega-catalog-freeze-state
          path: |
            catalog/freeze-inputs.json
            catalog/state/index.json
            catalog/state/freeze.json
            catalog/state/catalog/index.json
            catalog/state/definitions/index.json
            catalog/state/definitions/worker/manifest.json
            catalog/state/definitions/source-revisions.json
            catalog/state/scan-queue.json
            catalog/state/source-inventory.json
            catalog/catalog-history-publication.json
          retention-days: 30

  notify-discord:
    name: Post published catalog update to Discord
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.discord_notice_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: discord-public
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with: {ref: sigmascope, fetch-depth: 1, persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {name: omega-catalog-discord-notice, path: discord-notice}
      - name: Post public update
        continue-on-error: true
        env:
          DISCORD_CATALOG_WEBHOOK_URL: ${{ secrets.DISCORD_CATALOG_WEBHOOK_URL }}
          DISCORD_SECURITY_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK_URL }}
          DISCORD_DEFINITIONS_WEBHOOK_URL: ${{ secrets.DISCORD_DEFINITIONS_WEBHOOK_URL }}
          DISCORD_EVIDENCE_WEBHOOK_URL: ${{ secrets.DISCORD_EVIDENCE_WEBHOOK_URL }}
        run: python tools/notifications/post_discord_notice.py --notice discord-notice/discord-notice.json
