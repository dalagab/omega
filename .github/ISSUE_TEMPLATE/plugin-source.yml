name: Add a plugin source
description: Submit a public Dalamud PluginMaster feed for Omega to validate and scan.
title: "Source submission: "
body:
  - type: markdown
    attributes:
      value: |
        Omega accepts public HTTPS PluginMaster feeds. The feed is validated with the same parser used by the catalog builder before it can be persisted. Accepted community sources start disabled by default and then pass through the normal catalog and security pipeline.
  - type: input
    id: source-url
    attributes:
      label: PluginMaster source URL
      description: Direct public HTTPS URL to `repo.json`, `pluginmaster.json`, or an equivalent Dalamud PluginMaster feed.
      placeholder: https://example.org/repo.json
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: Repository URL, maintainer information, or why this source should be included.
