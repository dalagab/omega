name: Omega analysis broker launcher

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Generic omega.analysis-request.v1 JSON object
        type: string
        required: true

permissions:
  contents: write

jobs:
  enqueue:
    uses: dalagab/omega/.github/workflows/analysis-broker.yml@sigmascope
    with:
      request_json: ${{ inputs.request_json }}
