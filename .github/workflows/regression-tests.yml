name: Omega security services regression tests

on:
  push:
    branches: [sigmascope]
    paths:
      - "tools/catalog/**"
      - "tools/security/**"
      - "tools/tests/**"
      - "sources/**"
      - "security-definitions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "tools/catalog/**"
      - "tools/security/**"
      - "tools/tests/**"
      - "sources/**"
      - "security-definitions/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Python security dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-security.txt
      - name: Install YARA compile-check dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yara
      - name: Run security-services Python regression suite
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Run SigmaScope scanner self-tests
        run: |
          python tools/catalog/sigmascope.py --self-test
          python tools/catalog/sigmascope.py --hardening-self-test
      - name: Run production pipeline self-test
        run: python tools/security/production_sigmascope_v2_pipeline.py --self-test
      - name: Run legacy projection compatibility self-tests
        run: |
          python tools/catalog/compact_sqlite_catalog.py --self-test
          python tools/catalog/project_marketplace_catalog.py --self-test
