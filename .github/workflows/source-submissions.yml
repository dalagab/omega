name: Omega security services · source submission launcher

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_url:
        description: "Public HTTPS Dalamud PluginMaster source URL"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  call-security-branch:
    uses: dalagab/omega/.github/workflows/source-submissions.yml@sigmascope
    with:
      source_url: ${{ inputs.source_url || '' }}
    secrets: inherit
