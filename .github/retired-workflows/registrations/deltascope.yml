name: Omega security services · DeltaScope developer audit

on:
  workflow_dispatch:
    inputs:
      strict_warnings:
        description: "Fail the audit on warnings as well as failures"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  call-security-branch:
    uses: dalagab/omega/.github/workflows/deltascope.yml@sigmascope
    with:
      strict_warnings: ${{ inputs.strict_warnings || false }}
    secrets: inherit
